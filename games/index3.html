beat:'Split into two teams of at least two people (alternate names). Each turn, one person gives clues for the phrase on screen. They must use words of only one syllable — no gestures, spelling or saying any part of the answer. Tap Correct when guessed, or Skip. Each team gets three 60-second turns. Highest score wins.',

// 01: ONE-BEAT BANTER
function initBeat(){Object.assign(g,{phase:'ready',team:0,turn:0,scores:[0,0],cards:shuffle(WORD_PROMPTS),index:0,found:0,skipped:0})}

function renderBeat(){const names=['Team A','Team B'],members=g.players.filter((_,i)=>i%2===g.team);let body=panel(`<div class="statbar"><span class="stat">Turn <strong>${Math.min(g.turn+1,6)} / 6</strong></span><span class="stat">${names[0]}: <strong>${g.scores[0]}</strong></span><span class="stat">${names[1]}: <strong>${g.scores[1]}</strong></span></div><div class="center">${g.phase==='ready'?`<div class="round-label">${names[g.team]} · ${playersText(members)}</div><div class="display">Can you speak in<br>one beat?</div><p class="lead">Give one-syllable clues only. Set the phone where the clue giver can see it, but the guessing team cannot.</p>${btn('Start 60 seconds','App.beatStart()')}`:g.phase==='play'?`<div class="round-label">${names[g.team]} · No long words!</div>${timeHtml()}<div class="secret-card" style="margin:15px auto;max-width:520px"><div class="small">Describe this without saying it</div><div class="display">${esc(g.cards[g.index])}</div></div><div class="actions center">${btn('✓ Correct','App.beatAnswer(true)')}${btn('Skip →','App.beatAnswer(false)','alt')}</div><p class="tiny">Correct this turn: ${g.found} · Skipped: ${g.skipped}</p>`:g.phase==='end'?`<div class="round-label">Time’s up</div><div class="display">+${g.found} points!</div><p class="lead">${names[g.team]} guessed ${g.found} phrases.</p>${btn(g.turn===5?'See winner →':'Next team →','App.beatNext()')}`:`<div class="display winner">🏆 ${g.scores[0]===g.scores[1]?'A perfect draw!':names[g.scores[0]>g.scores[1]?0:1]+' wins!'}</div>${scoreboard(names,g.scores)}${btn('Play again','App.restart()')}</div>`}</div>`);shell(body)}
App.beatStart=()=>{g.phase='play';g.found=0;g.skipped=0;clock(60,()=>{g.phase='end';render()});render()};
App.beatAnswer=correct=>{if(g.phase!=='play')return;if(correct){g.scores[g.team]++;g.found++}else g.skipped++;nextBeatWord();render()};
App.beatNext=()=>{if(g.turn===5){g.phase='final'}else{g.turn++;g.team=1-g.team;g.phase='ready'}render()};

const VOWELS='AAAAEEEEIIIIOOOUU',CONSONANTS='BBCCDDFFGGHHJKLLLMMNNNNPPQRRRRSSSSTTTTTVWWXYZ';
function drawLetter(){return Math.random()<.46?pick(VOWELS.split('')):pick(CONSONANTS.split(''))}
function drawRack(){return shuffle([...Array.from({length:5},()=>pick(VOWELS)),...Array.from({length:6},()=>pick(CONSONANTS))])}
function initHeist(){Object.assign(g,{phase:'pass',turn:0,rounds:4,racks:g.players.map(drawRack),words:[],target:-1,error:''})}
function differenceWord(word,source){const pool=word.toUpperCase().split('');for(const char of source.toUpperCase()){const k=pool.indexOf(char);if(k===-1)return null;pool.splice(k,1)}return pool}
function renderHeist(){const who=g.turn%g.players.length,round=Math.floor(g.turn/g.players.length)+1,n=g.players.length;let b='';const totals=g.players.map((_,i)=>g.words.filter(w=>w.owner===i).reduce((a,w)=>a+w.text.length,0));
 if(g.phase==='pass')b=pass(g.players[who],`Round ${round}/${g.rounds}. Keep your letter tiles hidden from the others.`,'App.heistReveal()');
 if(g.phase==='play'){let rack=g.racks[who];b=panel(`<div class="statbar"><div class="stat">Round <strong>${round}/${g.rounds}</strong></div><div class="stat">Playing: <strong>${esc(g.players[who])}</strong></div></div><h2>Make a word. Or steal one.</h2><div class="tiles">${rack.map(c=>`<span class="tile">${c}</span>`).join('')}</div><p class="small center">Your tiles (${rack.length}) · Use each tile no more than once</p><div class="divider"></div><label>Your move</label><div class="choice-grid"><button class="choice ${g.target===-1?'selected':''}" onclick="App.heistTarget(-1)">✨ Build a new word<small>Use only your letters</small></button>${g.words.filter(w=>w.owner!==who).map(w=>`<button class="choice ${g.target===w.id?'selected':''}" onclick="App.heistTarget(${w.id})">🥷 Steal <strong>${esc(w.text)}</strong><small>From ${esc(g.players[w.owner])} · add at least one tile</small></button>`).join('')}</div><label for="heist-word">${g.target===-1?'New word':'New longer word using ALL stolen letters'}</label><input class="field" id="heist-word" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. STONE" maxlength="24" onkeydown="if(event.key==='Enter')App.heistSubmit()"/>${g.error?`<div class="error">${esc(g.error)}</div>`:''}<div class="actions">${btn('Submit word →','App.heistSubmit()')}${btn('Swap my letters (uses turn)','App.heistSwap()','alt')}</div>`)}
 if(g.phase==='final'){const max=Math.max(...totals);b=win(g.players.filter((_,i)=>totals[i]===max).join(' & ')+' '+(totals.filter(v=>v===max).length>1?'tie!':'wins!'),'Longest words and best heists win the day.',g.players,totals)}
 let words=g.words.length?`<div class="word-list">${g.words.map(w=>`<span class="word-pill"><strong>${esc(w.text)}</strong> · ${esc(g.players[w.owner])}</span>`).join('')}</div>`:'<p class="muted">No words on the table yet.</p>';
 shell(b+panel(`<h3>Words on the table</h3>${words}<h3>Current standings</h3>${scoreboard(g.players,totals)}`,'soft'))}
App.heistReveal=()=>{g.phase='play';render()};
App.heistTarget=i=>{g.target=i;g.error='';render()};
function heistAdvance(){g.turn++;g.target=-1;g.error='';g.phase=g.turn>=g.players.length*g.rounds?'final':'pass';render()}
App.heistSubmit=()=>{if(g.phase!=='play')return;const who=g.turn%g.players.length,word=input('heist-word').toUpperCase().replace(/\s+/g,'');if(!/^[A-Z]{3,24}$/.test(word)){g.error='Enter one English word using at least three letters (A–Z).';render();return}if(g.words.some(w=>w.text===word)){g.error='This exact word is already on the table. Try something different.';render();return}const target=g.target<0?null:g.words.find(w=>w.id===g.target);if(g.target>=0&&!target){g.error='That word is no longer available.';render();return}if(target&&word.length<=target.text.length){g.error='Your stolen word must be longer than the original.';render();return}const needed=differenceWord(word,target?.text||'');if(!needed){g.error='You must use every letter of the word you are stealing.';render();return}const rack=g.racks[who],left=differenceWord(rack.join(''),needed.join(''));if(left===null){g.error='You do not have the extra letters needed. Check your tiles.';render();return}if(!window.confirm(`Group check: is “${word}” a valid English word?`))return;g.racks[who]=left;while(g.racks[who].length<11)g.racks[who].push(drawLetter());if(target){target.text=word;target.owner=who}else g.words.push({id:Date.now()+rand(1e6),text:word,owner:who});announce(g.players[who]+' played '+word);heistAdvance()};

 if(g.phase==='discuss')b=panel(`<div class="center"><div class="round-label">Dawn has broken</div><div class="display">Who is lying?</div><p class="lead">You have all completed your night actions. Talk, accuse, defend and bluff. When ready, vote out one suspicious player.</p>${btn('Start secret vote →','App.nightVoteStart()')}</div>`);

 if(g.phase==='result'){const votes=g.players.map((_,i)=>g.votes.filter(x=>x===i).length),max=Math.max(...votes),leaders=votes.map((v,i)=>v===max&&v>0?i:-1).filter(i=>i>=0),winVillage=leaders.length===1&&g.roles[leaders[0]]==='Shadow';b=panel(`<div class="center"><div class="round-label">Night over</div><div class="display winner">${winVillage?'🌅 Village wins!':'🌑 Shadows win!'}</div><p class="lead">${leaders.length===1?esc(g.players[leaders[0]])+' received the most votes.':'A tie or abstentions meant nobody was eliminated.'}</p><div class="scoreboard">${g.players.map((p,i)=>`<div class="score"><span>${esc(p)}</span><strong style="font-size:1rem">${esc(g.roles[i])}</strong><span>${votes[i]} votes</span></div>`).join('')}</div>${btn('Another night','App.restart()')}</div>`)}

const alive=()=>g.players.map((_,i)=>i).filter(i=>g.tokens[i].length>0);
function initBloom(){Object.assign(g,{phase:'placepass',cursor:0,layer:1,tokens:g.players.map(()=>['Rose','Rose','Rose','Thorn']),stacks:g.players.map(()=>[]),points:g.players.map(()=>0),round:1,bid:0,bidCursor:0,leader:-1,bidActive:[],flips:[],safe:0,outcome:'',finished:false})}
function bloomAvailable(i){const left=[...g.tokens[i]];for(const placed of g.stacks[i]){const index=left.indexOf(placed);if(index>=0)left.splice(index,1)}return left}
function beginBloomBids(){g.phase='bid';g.bid=0;g.leader=-1;g.bidActive=g.players.map((_,i)=>g.tokens[i].length>0);g.bidCursor=alive()[0]??0;render()}
function nextBloomPlace(){const remaining=alive().filter(i=>i>g.cursor);if(remaining.length){g.cursor=remaining[0];g.phase=g.layer===1?'placepass':'secondpass'}else if(g.layer===1){g.layer=2;g.cursor=alive()[0];g.phase='secondpass'}else{beginBloomBids();return}render()}
function bloomNextBid(current){const opts=alive().filter(i=>g.bidActive[i]&&i!==g.leader);if(!opts.length){g.phase='reveal';g.flips=g.players.map(()=>0);g.safe=0;render();return}let next=opts.find(i=>i>current);if(next===undefined)next=opts[0];g.bidCursor=next;render()}
function finishBloom(success,detail){if(success){g.points[g.leader]++;g.outcome=`${g.players[g.leader]} did it! ${detail} +1 point.`}else{const list=g.tokens[g.leader];const removed=rand(list.length);const lost=list.splice(removed,1)[0];g.outcome=`${g.players[g.leader]} hit a Thorn. ${detail} One random tile (${lost}) was lost permanently.`}g.phase='outcome';if(g.points.some(x=>x>=2)||alive().length<2)g.finished=true;render()}
function renderBloom(){const count=g.stacks.reduce((sum,st)=>sum+st.length,0);let b='';
 if(g.phase==='placepass')b=pass(g.players[g.cursor],`Round ${g.round}: secretly choose your ${g.layer===1?'first':'second'} tile. Others should look away.`,'App.bloomShowPlace()');
 if(g.phase==='place'){const av=bloomAvailable(g.cursor);const r=av.filter(x=>x==='Rose').length,t=av.filter(x=>x==='Thorn').length;b=panel(`<div class="center"><div class="round-label">Private tile · ${esc(g.players[g.cursor])}</div><h2>Choose a tile to hide</h2><p class="muted">Only you can see the tile you are placing. All other players see only the size of your stack.</p><div class="choice-grid">${r?`<button class="choice" onclick="App.bloomPlace('Rose')" style="text-align:center;font-size:1.4rem">🌹 Rose<small>${r} left this round</small></button>`:''}${t?`<button class="choice" onclick="App.bloomPlace('Thorn')" style="text-align:center;font-size:1.4rem">🌵 Thorn<small>${t} left this round</small></button>`:''}</div></div>`)}
 if(g.phase==='secondpass')b=panel(`<div class="center"><div class="round-label">Private choice · ${esc(g.players[g.cursor])}</div><h2>Add a second hidden tile?</h2><p class="lead">Adding a second tile makes a larger stack for everyone to challenge. You may also stop now.</p><div class="actions center">${btn('Add another tile','App.bloomSecond(true)')}${btn('No thanks, pass','App.bloomSecond(false)','alt')}</div></div>`);
 if(g.phase==='bid'){const available=Array.from({length:Math.min(count-g.bid,5)},(_,i)=>g.bid+i+1);if(count>g.bid+5)available.push(count);b=panel(`<div class="round-label">Challenge round · ${esc(g.players[g.bidCursor])} to bid</div><h2>How many Roses can you reveal?</h2><div class="statbar"><span class="stat">Tiles face down: <strong>${count}</strong></span><span class="stat">Current bid: <strong>${g.bid||'none'}</strong></span><span class="stat">Leading: <strong>${g.leader<0?'no one':esc(g.players[g.leader])}</strong></span></div><p class="muted">Raise above the current bid or pass. Once you pass you are out of this round’s bidding.</p><div class="choice-grid">${available.map(x=>`<button class="choice" onclick="App.bloomBid(${x})">I can flip <strong>${x}</strong> Roses</button>`).join('')}</div><div class="actions">${btn('Pass on bidding','App.bloomPass()','alt'+(!g.bid?' disabled':''))}</div>`);if(!g.bid)b=b.replace('class="btn alt disabled"','class="btn alt" disabled')}
 if(g.phase==='reveal'){const ownRemain=g.flips[g.leader]<g.stacks[g.leader].length;const needed=g.bid-g.safe;b=panel(`<div class="center"><div class="round-label">${esc(g.players[g.leader])} accepted the challenge</div><div class="display">${g.safe} / ${g.bid} 🌹</div><p class="lead">${ownRemain?'You must reveal every tile in your own stack first.':'Pick a stack to reveal its top tile. You need '+needed+' more Rose'+(needed===1?'':'s')+'!'}</p></div><div class="stacks">${g.players.map((p,i)=>{const left=g.stacks[i].length-g.flips[i];return `<div class="stack"><strong>${esc(p)}</strong><div class="stack-art">${left?'🂠'.repeat(Math.min(left,3)):'—'}</div><div class="tiny">${left} hidden</div>${left&&(!ownRemain||i===g.leader)?btn('Reveal top','App.bloomFlip('+i+')','sm'):''}</div>`}).join('')}</div>`)}
 if(g.phase==='outcome')b=panel(`<div class="center"><div class="round-label">Challenge result</div><div class="display">${g.outcome.includes('did it')?'🌹 SUCCESS':'🌵 OUCH'}</div><p class="lead">${esc(g.outcome)}</p>${g.finished?`${btn('See the winner','App.bloomNext()')}`:`${btn('Next round →','App.bloomNext()')}`}</div>`);
 if(g.phase==='final'){const winner=g.points.some(x=>x>=2)?g.players[g.points.indexOf(Math.max(...g.points))]:g.players[alive()[0]];b=win(winner+' wins!','The sharpest bluffer takes the crown.',g.players,g.points)}
 if(['placepass','place','secondpass','bid'].includes(g.phase))b+=panel(`<h3>Face-down stacks</h3><div class="stacks">${g.players.map((p,i)=>`<div class="stack"><strong>${esc(p)}</strong><div class="stack-art">${g.stacks[i].length?'🂠'.repeat(g.stacks[i].length):'—'}</div><div class="tiny">${g.stacks[i].length} placed</div></div>`).join('')}</div><h3>Points (first to two)</h3>${scoreboard(g.players,g.points)}`,'soft');
 shell(b)}
App.bloomShowPlace=()=>{g.phase='place';render()};
App.bloomPlace=type=>{const av=bloomAvailable(g.cursor);if(!av.includes(type))return;g.stacks[g.cursor].push(type);nextBloomPlace()};
App.bloomSecond=add=>{if(add&&bloomAvailable(g.cursor).length){g.phase='placepass';render()}else nextBloomPlace()};
App.bloomBid=amount=>{if(g.phase!=='bid'||amount<=g.bid||amount>g.stacks.reduce((a,b)=>a+b.length,0))return;g.bid=amount;g.leader=g.bidCursor;g.bidActive[g.leader]=true;const total=g.stacks.reduce((a,b)=>a+b.length,0);if(amount>=total){g.flips=g.players.map(()=>0);g.safe=0;g.phase='reveal';render()}else bloomNextBid(g.bidCursor)};
App.bloomPass=()=>{if(!g.bid)return;g.bidActive[g.bidCursor]=false;bloomNextBid(g.bidCursor)};
App.bloomFlip=i=>{if(g.phase!=='reveal')return;const ownLeft=g.flips[g.leader]<g.stacks[g.leader].length;if(ownLeft&&i!==g.leader)return;const pile=g.stacks[i],num=g.flips[i];if(num>=pile.length)return;const type=pile[pile.length-num-1];g.flips[i]++;if(type==='Thorn'){finishBloom(false,`${g.safe} safe Rose${g.safe===1?'':'s'} revealed.`)}else{g.safe++;if(g.safe>=g.bid)finishBloom(true,`${g.safe} Roses revealed without a Thorn.`);else{announce('Rose! '+g.safe+' of '+g.bid);render()}}};
App.bloomNext=()=>{if(g.finished){g.phase='final';render();return}g.round++;g.stacks=g.players.map(()=>[]);g.cursor=alive()[0];g.layer=1;g.phase='placepass';render()};
// 06: FACT TRAP
function initFact(){Object.assign(g,{phase:'authorpass',round:0,maxRounds:5,money:g.players.map(()=>10),facts:shuffle(FACTS),votes:[],answers:[],author:0,voterCursor:0,bet:1,error:''})}
function factVoterNext(){const others=g.players.map((_,i)=>i).filter(i=>i!==g.author);const next=others.find(i=>i>g.voterCursor);if(next===undefined){g.phase='result'}else{g.voterCursor=next;g.phase='votepass';g.bet=Math.max(0,Math.min(1,g.money[next]))}render()}
function renderFact(){const question=g.facts[g.round],author=g.author;let b='';
 if(g.phase==='authorpass')b=pass(g.players[author],`Round ${g.round+1}/${g.maxRounds}. You're writing two very plausible lies. Do not show the real answer.`,'App.factShowAuthor()');
 if(g.phase==='authorwrite')b=panel(`<div class="round-label">Author’s eyes only · ${esc(g.players[author])}</div><h2>${esc(question.q)}</h2><div class="secret-card"><div class="small">The ACTUAL answer is</div><div class="display">${esc(question.answer)}</div></div><p class="lead">Invent two answers that could fool your friends. Don't use the true answer.</p><label for="fake1">Fake answer 1</label><input id="fake1" class="field" maxlength="80" autocomplete="off" placeholder="First convincing lie"/><label for="fake2">Fake answer 2</label><input id="fake2" class="field" maxlength="80" autocomplete="off" placeholder="Second convincing lie"/>${g.error?`<p class="error">${esc(g.error)}</p>`:''}${btn('Shuffle answers & start betting →','App.factAuthorSubmit()')}`);
 if(g.phase==='votepass')b=pass(g.players[g.voterCursor],`Round ${g.round+1}. Choose which answer is real and bet some of your ${g.money[g.voterCursor]} chips.`,'App.factVoteReveal()');
 if(g.phase==='vote'){const money=g.money[g.voterCursor];b=panel(`<div class="round-label">Secret wager · ${esc(g.players[g.voterCursor])}</div><h2>${esc(question.q)}</h2><p class="lead">Which answer is true? You have <strong>${money}</strong> chips.</p>${money>0?`<label>Your wager</label><div class="actions">${[1,2,3].filter(n=>n<=money).map(n=>`<button class="btn ${g.bet===n?'':'alt'} sm" onclick="App.factBet(${n})">${n} chip${n===1?'':'s'}</button>`).join('')}</div><h3 style="margin-top:20px">Pick your answer</h3>${g.answers.map((v,i)=>`<button class="fact-option" onclick="App.factVote(${i})">${String.fromCharCode(65+i)}. ${esc(v.text)}</button>`).join('')}`:`<div class="notice">You’re out of chips, so you must skip this wager.</div>${btn('Skip this wager →','App.factVote(-1)')}`}`)}
 if(g.phase==='result'){const correct=g.answers.find(x=>x.real),correctCount=g.votes.filter(v=>v.real).length;const fooled=g.votes.filter(v=>!v.real&&!v.skipped).length;b=panel(`<div class="center"><div class="round-label">Round ${g.round+1} revealed</div><h2>${esc(question.q)}</h2><div class="display winner">${esc(correct.text)}</div><p class="lead">${correctCount} player${correctCount===1?'':'s'} found the truth. ${fooled} fell for the author's invented answers.</p><div class="word-list">${g.answers.map(x=>`<span class="word-pill">${x.real?'✅ TRUE':'🎭 FAKE'}: ${esc(x.text)}</span>`).join('')}</div><div class="divider"></div><h3>Chips</h3>${scoreboard(g.players,g.money)}${btn(g.round===g.maxRounds-1?'See final winner':'Next round →','App.factNext()')}</div>`)}
 if(g.phase==='final'){const max=Math.max(...g.money);b=win(g.players.filter((_,i)=>g.money[i]===max).join(' & ')+' '+(g.money.filter(x=>x===max).length===1?'wins!':'tie!'),'The best poker face, smartest wager or most believable lies.',g.players,g.money)}
 shell(b)}
App.factShowAuthor=()=>{g.phase='authorwrite';render()};
App.factAuthorSubmit=()=>{const one=input('fake1'),two=input('fake2'),truth=g.facts[g.round].answer;if([one,two].some(x=>x.length<2)||norm(one)===norm(two)||norm(one)===norm(truth)||norm(two)===norm(truth)){g.error='Write two distinct fake answers that differ from the truth (at least 2 characters).';const err=$('fact-error');if(err)err.textContent=g.error;else{const target=$('fake2');if(target)target.insertAdjacentHTML('afterend',`<div class="error" id="fact-error">${esc(g.error)}</div>`)}return}g.error='';g.answers=shuffle([{text:truth,real:true},{text:one,real:false},{text:two,real:false}]);g.votes=[];g.voterCursor=g.players.map((_,i)=>i).find(i=>i!==g.author);g.bet=Math.min(1,g.money[g.voterCursor]);g.phase='votepass';render()};
App.factVoteReveal=()=>{g.phase='vote';render()};
App.factBet=n=>{if(n>g.money[g.voterCursor]||n<1)return;g.bet=n;render()};
App.factVote=i=>{if(g.phase!=='vote')return;const p=g.voterCursor,bet=i===-1?0:g.bet,selected=g.answers[i];if(bet>g.money[p])return;if(bet){if(selected.real){g.money[p]+=bet}else{g.money[p]-=bet;g.money[g.author]+=bet}}g.votes.push({player:p,bet,real:!!selected?.real,skipped:!bet});factVoterNext()};
App.factNext=()=>{g.round++;if(g.round>=g.maxRounds){g.phase='final'}else{g.author=g.round%g.players.length;g.phase='authorpass';g.answers=[];g.votes=[]}render()};
// 07: TRIPLE CLUE DASH
function initTriple(){Object.assign(g,{phase:'ready',round:0,maxRounds:10,cards:shuffle(TRIPLE),points:g.players.map(()=>0),claim:-1,correct:false})}
function renderTriple(){const c=g.cards[g.round];let b='';
 if(g.phase==='ready')b=panel(`<div class="center"><div class="round-label">Round ${g.round+1} / ${g.maxRounds}</div><div class="display">Ready, word nerds?</div><p class="lead">The first person to shout a word fitting all three rules should be selected. The group decides whether the answer qualifies.</p>${btn('Show the clues · 25 seconds','App.tripleStart()')}</div>`);
 if(g.phase==='play')b=panel(`<div class="center"><div class="round-label">Round ${g.round+1}/${g.maxRounds} · Shout an answer!</div>${timeHtml()}<div class="condition-row"><div class="condition">${esc(c.a)}</div><div class="condition">${esc(c.b)}</div><div class="condition">${esc(c.c)}</div></div><p class="lead" style="margin-top:22px">Who called out an answer first?</p><div class="choice-grid">${g.players.map((p,i)=>`<button class="choice" onclick="App.tripleClaim(${i})">⚡ ${esc(p)}</button>`).join('')}</div></div>`);
 if(g.phase==='judge')b=panel(`<div class="center"><div class="round-label">Judging ${esc(g.players[g.claim])}’s answer</div><h2>Did their word fit ALL THREE clues?</h2><div class="condition-row"><div class="condition">${esc(c.a)}</div><div class="condition">${esc(c.b)}</div><div class="condition">${esc(c.c)}</div></div><div class="actions center">${btn('Yes, +1 point','App.tripleJudge(true)')}${btn('No, −1 point','App.tripleJudge(false)','danger')}</div></div>`);
 if(g.phase==='between')b=panel(`<div class="center"><div class="round-label">Round ${g.round+1} complete</div><div class="display">${g.claim<0?'⏱ Time up!':g.correct?'✅ Good word!':'❌ Not quite!'}</div><p class="lead">One possible answer: <strong>${esc(c.sample)}</strong></p>${scoreboard(g.players,g.points)}${btn(g.round===g.maxRounds-1?'See winner →':'Next clue →','App.tripleNext()')}</div>`);
 if(g.phase==='final'){const max=Math.max(...g.points);b=win(g.players.filter((_,i)=>g.points[i]===max).join(' & ')+' '+(g.points.filter(x=>x===max).length>1?'tie!':'wins!'),'Fast brains and quick mouths win.',g.players,g.points)}
 shell(b)}
App.tripleStart=()=>{g.phase='play';clock(25,()=>{g.claim=-1;g.phase='between';render()});render()};
App.tripleClaim=i=>{if(g.phase!=='play')return;clearClock();g.claim=i;g.phase='judge';render()};
App.tripleJudge=correct=>{if(g.phase!=='judge')return;g.correct=correct;g.points[g.claim]+=correct?1:-1;g.phase='between';render()};
App.tripleNext=()=>{g.round++;g.phase=g.round>=g.maxRounds?'final':'ready';g.claim=-1;g.correct=false;render()};
// 08: PATTERN PANIC
const SHAPES=['◆','●','▲','★'];const COLORS=['#ff8d80','#a6baff','#e4d57b','#b9ed9d'];
function patternRandom(){return{shape:rand(SHAPES.length),color:rand(COLORS.length),num:1+rand(3)}}
function patternMatches(a,b){return Number(a.shape===b.shape)+Number(a.color===b.color)+Number(a.num===b.num)}
function newPattern(){g.target=patternRandom();let yes=[],no=[];let tries=0;while((yes.length<4||no.length<8)&&tries++<2000){const t=patternRandom(),m=patternMatches(t,g.target);if(m>=2&&yes.length<4)yes.push(t);else if(m<2&&no.length<8)no.push(t)}g.board=shuffle([...yes,...no]);}
function initPattern(){Object.assign(g,{phase:'pass',turn:0,points:g.players.map(()=>0),hits:0,misses:0,target:null,board:[]})}
function patternTile(p){return `<div class="pattern-symbols" style="color:${COLORS[p.color]}">${Array.from({length:p.num},()=>SHAPES[p.shape]).join(' ')}</div>`}
function renderPattern(){let b='';
 if(g.phase==='pass')b=pass(g.players[g.turn],`Your 45-second turn is next. Tap tiles matching any two or all three traits. The others should cheer you on.`,'App.patternStart()');
 if(g.phase==='play')b=panel(`<div class="center"><div class="round-label">${esc(g.players[g.turn])} · Find two matching attributes</div>${timeHtml()}<p class="small">Match at least 2 of: symbol · colour · number of symbols</p><div class="pattern-target"><div class="round-label">Your target</div>${patternTile(g.target)}</div></div><div class="pattern-board" style="margin-top:15px">${g.board.map((p,i)=>`<button class="pattern-tile" aria-label="Pattern tile ${i+1}" onclick="App.patternTap(${i})">${patternTile(p)}</button>`).join('')}</div><div class="statbar" style="margin-top:15px"><span class="stat">Score: <strong>${g.points[g.turn]}</strong></span><span class="stat">Correct: <strong>${g.hits}</strong></span><span class="stat">Mistakes: <strong>${g.misses}</strong></span></div>`);
 if(g.phase==='turnend')b=panel(`<div class="center"><div class="round-label">Time’s up!</div><div class="display">${esc(g.players[g.turn])}: ${g.points[g.turn]}</div><p class="lead">${g.hits} matches and ${g.misses} missed taps.</p>${btn(g.turn===g.players.length-1?'See final winner →':'Next player →','App.patternNext()')}</div>`);
 if(g.phase==='final'){const max=Math.max(...g.points);b=win(g.players.filter((_,i)=>g.points[i]===max).join(' & ')+' '+(g.points.filter(x=>x===max).length>1?'tie!':'wins!'),'Speed, sharp eyes and staying cool under pressure.',g.players,g.points)}
 if(g.phase!=='play')b+=panel(`<h3>Standings</h3>${scoreboard(g.players,g.points,g.turn)}`,'soft');shell(b)}
App.patternStart=()=>{g.phase='play';g.hits=0;g.misses=0;newPattern();clock(45,()=>{g.phase='turnend';render()});render()};
App.patternTap=i=>{if(g.phase!=='play')return;const p=g.board[i];if(!p)return;if(patternMatches(p,g.target)>=2){g.points[g.turn]+=2;g.hits++;newPattern();announce('Correct!')}else{g.points[g.turn]=Math.max(0,g.points[g.turn]-1);g.misses++;announce('Not a match')}render()};
App.patternNext=()=>{g.turn++;g.phase=g.turn>=g.players.length?'final':'pass';render()};
window.App=App;
renderHome();
</script>
