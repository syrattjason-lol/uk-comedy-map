const RULES={
beat:'Split into two teams of at least two people (alternate names). Each turn, one person gives clues for the phrase on screen. They must use words of only one syllable — no gestures, spelling or saying any part of the answer. Tap Correct when guessed, or Skip. Each team gets three 60-second turns. Highest score wins.',
spy:'One player secretly sees only the category: they are the spy. Everyone else sees the same secret word. Pass the device so nobody else can see your card. Go round giving one-word clues aloud, then discuss. Each player votes privately for the spy. A tied vote lets the spy escape. If exposed, the spy gets one guess at the word to steal victory.',
heist:'Each player has a private rack of letter tiles. Type an English word of three or more letters using your tiles and submit it. Alternatively choose a rival’s word and transform ALL its letters into a different, longer word using at least one letter from your rack. You gain the stolen word and its points. No online dictionary: the group settles whether a word is valid. Four turns each; highest total word-length score wins. Swapping your tiles uses your turn.',
night:'Secretly read your role. Shadows want to avoid being voted out; everyone else wants to expose a Shadow. During the night, the Investigator may privately inspect one player; the Mask Maker may swap two players’ roles, potentially changing the Shadow team. Then discuss aloud and vote privately. If a Shadow gets the most votes without a tie, the village wins. Otherwise the Shadows win. Original roles determine who performs night actions.',
bloom:'Each player has three Roses and one Thorn. Secretly place one tile, then each may place one extra tile. Bid on how many Roses you can flip without hitting a Thorn. Raise or pass; after all but the highest bidder have passed, the bidder must reveal their own tiles first, then choose other piles. Win a challenge to score a point; hit a Thorn and permanently lose one random tile. First to two points wins.',
fact:'Every round has an unbelievable-but-true answer. The author secretly sees the truth and invents two convincing lies, or taps Skip question to draw a different one without losing a round or chips. Everyone else secretly picks an answer and wagers 1–3 chips. Correct guesses gain the wager; wrong guesses lose it and pay the author. After five completed rounds, the richest player wins. Questions are original, not copied publisher cards.',
triple:'Shout a word or short phrase that fits all three clues in a delightfully awkward situation. Tap whoever calls an answer first. The group decides if it counts: +1 for a good answer, −1 for an incorrect claim. You get 30 seconds per challenge and ten challenges per match. If everyone is stumped, reveal the sample answer and move on. Weird but defensible answers absolutely count.',
pattern:'Find a card matching at least TWO of the target’s three attributes: symbol, colour and number of symbols. Tap quickly to score; wrong taps cost one point. Every correct tap creates a new target and board. Players take separate 45-second turns, using the same device. Highest score wins.',
cuts:'Pass the phone to the artist, keeping the prompt secret. Use your finger or mouse to trace closed outlines on the digital paper; every shape becomes a cutout. Add multiple shapes to build your object. After 75 seconds or when ready, hand the screen to the guessers. They have 30 seconds to guess. The artist earns 2 points and the correct guesser earns 1. Each person gets two turns. Works fully on screen; paper and scissors are optional.',
food:'Two teams play a 12-question food quiz. Names entered on alternate lines join Team A and Team B. Everyone sees the question, and the fastest team taps its buzzer to choose from four answers. A correct first answer earns 2 points. If it is wrong, the other team can steal for 1 point, without seeing the correct answer. You can skip a question to reveal the answer. Highest score wins. All questions and explanations are original.',
hum:'Players take turns as the singer. Hold the screen privately so nobody sees the song name. Hum the tune from memory (no lyrics, talking or showing the title). Every correct guess earns the singer one point; use Skip for songs you do not know. Each singer has a 60-second turn, with two turns per player. Choose a song deck before you start: Party Favourites, Throwbacks, Screen Themes or a Mix. No recordings, playback or song lyrics are supplied.',
category:'Choose one of ten fresh lists of 12 categories. In each of 3 rounds everyone gets the SAME list and ONE rolled letter, but answers privately on the same device. Start a timer (60–180 seconds) for each person and pass the phone. An answer must fit the category and start with the letter; repeated answers across players earn zero points. Read out answers and tap any dubious answer to challenge and disallow it. Valid unique answers get one point each; additional words starting with the same letter earn one extra point apiece. Original category prompts; unofficial Scattergories-style gameplay.',
couch:'Inspired by the format of the vintage Therapy board game, with an original digital board, art and questions. Roll two dice around six life stages: Infancy, Childhood, Adolescence, Adulthood, Seniority and Cosmos. On Insight, answer a psychology trivia question to earn a peg from that stage. On Insight/Chance you may risk going to the Spiral and losing a peg if you are wrong. On Office and Group Therapy, one player secretly answers a personality or scenario prompt; the therapist or group tries to predict their response. Matches reward mastery pegs and the patient rolls again, but misses keep the patient in therapy until cured. On inkblots, predict the patient’s interpretation to earn them a peg; a miss enters the Spiral. Crisis cards bring random twists. The first person to collect all six pegs and pass START / FINISH wins. Unofficial original fan-style adaptation, not affiliated with the publisher.'

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const rand=n=>Math.floor(Math.random()*n);
const shuffle=a=>[...a].sort(()=>0.5-Math.random());
const pick=a=>a[rand(a.length)];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const btn=(label,js,cls='')=>`<button type="button" class="btn ${cls}" onclick="${js}">${label}</button>`;
const opts=(arr,fn)=>arr.map((x,i)=>`<button class="choice" onclick="${fn}(${i})">${esc(x)}</button>`).join('');
const playersText=arr=>arr.map(esc).join(', ');
const scoreboard=(players,nums,active=-1)=>`<div class="scoreboard">${players.map((name,i)=>`<div class="score ${i===active?'active':''}"><span>${esc(name)}</span><strong>${nums[i]??0}</strong></div>`).join('')}</div>`;
const phaseTitle=(name,text)=>`<div class="round-label">${esc(name)}</div><h2>${esc(text)}</h2>`;
let g=null,configId=null,activeTimer=null,timerEnds=0,timerCallback=null;
function clearClock(){if(activeTimer)clearInterval(activeTimer);activeTimer=null;timerCallback=null}
function clock(seconds,callback){clearClock();timerCallback=callback;timerEnds=Date.now()+seconds*1000;tickClock();activeTimer=setInterval(tickClock,170)}
function tickClock(){if(!activeTimer&&!timerCallback)return;const left=Math.max(0,Math.ceil((timerEnds-Date.now())/1000));if($('timer-value'))$('timer-value').textContent=left;if(!left){const cb=timerCallback;clearClock();if(cb)cb()}}
function timeHtml(){const left=activeTimer?Math.max(0,Math.ceil((timerEnds-Date.now())/1000)):0;return `<span class="timer" id="timer-value" role="timer" aria-label="Time remaining in seconds">${left}</span>`}
function announce(t){if($('announcer'))$('announcer').textContent=t}
function input(id){return $(id)?.value?.trim()||''}

function pass(name,text,fn){return panel(`<div class="center"><div class="round-label">Private screen · No peeking</div><div class="display">📱 → ${esc(name)}</div><p class="lead">${esc(text)}</p>${btn('I have the phone →',fn)}</div>`)}

const App={
 home:renderHome,

 launch(){const m=GAME_INFO.find(x=>x.id===configId),players=input('names').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);if(players.length<m.min||players.length>m.max){$('setup-error').innerHTML=`<div class="error">Please enter ${m.min}–${m.max} player names. You entered ${players.length}.</div>`;return}if(new Set(players.map(s=>s.toLowerCase())).size!==players.length){$('setup-error').innerHTML='<div class="error">Give everyone a different name.</div>';return}const id=configId;g={id,players};clearClock();if(id==='beat')initBeat();if(id==='spy')initSpy();if(id==='heist')initHeist();if(id==='night')initNight();if(id==='bloom')initBloom();if(id==='fact')initFact();if(id==='triple')initTriple();if(id==='pattern')initPattern();if(id==='cuts')initCuts();if(id==='food')initFood();if(id==='hum')initHum();if(id==='category')initCategory();if(id==='couch')initCouch();render()},
 restart(){if(!g)return;clearClock();const id=g.id,players=g.players.slice();g={id,players};if(id==='beat')initBeat();if(id==='spy')initSpy();if(id==='heist')initHeist();if(id==='night')initNight();if(id==='bloom')initBloom();if(id==='fact')initFact();if(id==='triple')initTriple();if(id==='pattern')initPattern();if(id==='cuts')initCuts();if(id==='food')initFood();if(id==='hum')initHum();if(id==='category')initCategory();if(id==='couch')initCouch();render()},
 // Game methods are assigned below.
};
function render(){if(!g){renderHome();return}({beat:renderBeat,spy:renderSpy,heist:renderHeist,night:renderNight,bloom:renderBloom,fact:renderFact,triple:renderTriple,pattern:renderPattern,cuts:renderCuts,food:renderFood,hum:renderHum,category:renderCategory,couch:renderCouch}[g.id])()}
// 01: ONE-BEAT BANTER
function initBeat(){Object.assign(g,{phase:'ready',team:0,turn:0,scores:[0,0],cards:shuffle(WORD_PROMPTS),index:0,found:0,skipped:0})}
function nextBeatWord(){g.index++;if(g.index>=g.cards.length){g.cards=shuffle(WORD_PROMPTS);g.index=0}}
function renderBeat(){const names=['Team A','Team B'],members=g.players.filter((_,i)=>i%2===g.team);let body=panel(`<div class="statbar"><span class="stat">Turn <strong>${Math.min(g.turn+1,6)} / 6</strong></span><span class="stat">${names[0]}: <strong>${g.scores[0]}</strong></span><span class="stat">${names[1]}: <strong>${g.scores[1]}</strong></span></div><div class="center">${g.phase==='ready'?`<div class="round-label">${names[g.team]} · ${playersText(members)}</div><div class="display">Can you speak in<br>one beat?</div><p class="lead">Give one-syllable clues only. Set the phone where the clue giver can see it, but the guessing team cannot.</p>${btn('Start 60 seconds','App.beatStart()')}`:g.phase==='play'?`<div class="round-label">${names[g.team]} · No long words!</div>${timeHtml()}<div class="secret-card" style="margin:15px auto;max-width:520px"><div class="small">Describe this without saying it</div><div class="display">${esc(g.cards[g.index])}</div></div><div class="actions center">${btn('✓ Correct','App.beatAnswer(true)')}${btn('Skip →','App.beatAnswer(false)','alt')}</div><p class="tiny">Correct this turn: ${g.found} · Skipped: ${g.skipped}</p>`:g.phase==='end'?`<div class="round-label">Time’s up</div><div class="display">+${g.found} points!</div><p class="lead">${names[g.team]} guessed ${g.found} phrases.</p>${btn(g.turn===5?'See winner →':'Next team →','App.beatNext()')}`:`<div class="display winner">🏆 ${g.scores[0]===g.scores[1]?'A perfect draw!':names[g.scores[0]>g.scores[1]?0:1]+' wins!'}</div>${scoreboard(names,g.scores)}${btn('Play again','App.restart()')}</div>`}</div>`);shell(body)}
App.beatStart=()=>{g.phase='play';g.found=0;g.skipped=0;clock(60,()=>{g.phase='end';render()});render()};
App.beatAnswer=correct=>{if(g.phase!=='play')return;if(correct){g.scores[g.team]++;g.found++}else g.skipped++;nextBeatWord();render()};
App.beatNext=()=>{if(g.turn===5){g.phase='final'}else{g.turn++;g.team=1-g.team;g.phase='ready'}render()};
// 02: SECRET WORD SPY
function initSpy(){Object.assign(g,{phase:'pass',cursor:0,sub:'hidden',card:pick(SPY_WORDS),spy:rand(g.players.length),votes:[],winner:null})}
function renderSpy(){let b='';const n=g.players.length;
 if(g.phase==='pass')b=pass(g.players[g.cursor],'Read your secret card, then hide it before passing the phone.', 'App.spyReveal()');
 if(g.phase==='reveal')b=panel(`<div class="center"><div class="round-label">Only ${esc(g.players[g.cursor])} should look</div><div class="secret-card"><div class="small">${g.cursor===g.spy?'You are the spy. Blend in!':'Secret word · '+esc(g.card[0])}</div><div class="display">${g.cursor===g.spy?'🕵️ SPY':esc(g.card[1])}</div><p>${g.cursor===g.spy?'Category: '+esc(g.card[0])+'. You do NOT know the word.':'Give a subtle clue. Do not say the secret word.'}</p></div><div class="actions center">${btn('Hide & pass the phone','App.spyPass()')}</div></div>`);
 if(g.phase==='discuss')b=panel(`<div class="center"><div class="round-label">Everyone has seen their card</div><div class="display">Talk it out.</div><p class="lead">Go round giving clues aloud, then accuse your most suspicious friend. When ready, vote privately. The spy can bluff, but shouldn't reveal themselves.</p>${btn('Begin private voting →','App.spyVoteStart()')}</div>`);
 if(g.phase==='votePass')b=pass(g.players[g.cursor],'Pick the player you think is the spy. Keep your vote private.','App.spyVoteReveal()');
 if(g.phase==='vote')b=panel(`<div class="round-label">Private vote · ${esc(g.players[g.cursor])}</div><h2>Who is the spy?</h2><div class="choice-grid">${g.players.map((p,i)=>i===g.cursor?'':`<button class="choice" onclick="App.spyVote(${i})">${esc(p)}</button>`).join('')}</div>`);
 if(g.phase==='guess')b=panel(`<div class="center"><div class="round-label">The spy has been caught</div><div class="display">${esc(g.players[g.spy])} is the spy!</div><p class="lead">But they have ONE chance to steal victory. What is the exact secret word?</p><label for="spy-guess">Secret word</label><input id="spy-guess" class="field" autocomplete="off" placeholder="Enter your guess"/><div class="actions center">${btn('Lock in answer','App.spyGuess()')}</div></div>`);
 if(g.phase==='result'){const tally=g.players.map((_,i)=>g.votes.filter(x=>x===i).length),title=g.winner==='spy'?g.players[g.spy]+' (the spy) wins!':'The group wins!';b=panel(`<div class="center"><div class="round-label">Secret revealed</div><div class="display winner">${esc(title)}</div><p class="lead">The word was <strong>${esc(g.card[1])}</strong>. The spy was <strong>${esc(g.players[g.spy])}</strong>.</p><h3>Votes</h3>${scoreboard(g.players,tally)}${btn('Another mystery','App.restart()')}</div>`)}
 shell(b)}
App.spyReveal=()=>{g.phase='reveal';render()};
App.spyPass=()=>{g.cursor++;g.phase=g.cursor>=g.players.length?'discuss':'pass';render()};
App.spyVoteStart=()=>{g.cursor=0;g.phase='votePass';render()};
App.spyVoteReveal=()=>{g.phase='vote';render()};
App.spyVote=i=>{g.votes.push(i);g.cursor++;if(g.cursor>=g.players.length){const tallies=g.players.map((_,j)=>g.votes.filter(v=>v===j).length),max=Math.max(...tallies),leaders=tallies.map((v,j)=>v===max?j:-1).filter(v=>v>=0);if(leaders.length===1&&leaders[0]===g.spy){g.phase='guess'}else{g.winner='spy';g.phase='result'}}else g.phase='votePass';render()};
App.spyGuess=()=>{if(!input('spy-guess'))return;g.winner=norm(input('spy-guess'))===norm(g.card[1])?'spy':'group';g.phase='result';render()};
// 03: LETTER HEIST
const VOWELS='AAAAEEEEIIIIOOOUU',CONSONANTS='BBCCDDFFGGHHJKLLLMMNNNNPPQRRRRSSSSTTTTTVWWXYZ';
function drawLetter(){return Math.random()<.46?pick(VOWELS.split('')):pick(CONSONANTS.split(''))}
function drawRack(){return shuffle([...Array.from({length:5},()=>pick(VOWELS)),...Array.from({length:6},()=>pick(CONSONANTS))])}
function initHeist(){Object.assign(g,{phase:'pass',turn:0,rounds:4,racks:g.players.map(drawRack),words:[],target:-1,error:''})}
function differenceWord(word,source){const pool=word.toUpperCase().split('');for(const char of source.toUpperCase()){const k=pool.indexOf(char);if(k===-1)return null;pool.splice(k,1)}return pool}
function renderHeist(){const who=g.turn%g.players.length,round=Math.floor(g.turn/g.players.length)+1,n=g.players.length;let b='';const totals=g.players.map((_,i)=>g.words.filter(w=>w.owner===i).reduce((a,w)=>a+w.text.length,0));
 if(g.phase==='pass')b=pass(g.players[who],`Round ${round}/${g.rounds}. Keep your letter tiles hidden from the others.`,'App.heistReveal()');
 if(g.phase==='play'){let rack=g.racks[who];b=panel(`<div class="statbar"><div class="stat">Round <strong>${round}/${g.rounds}</strong></div><div class="stat">Playing: <strong>${esc(g.players[who])}</strong></div></div><h2>Make a word. Or steal one.</h2><div class="tiles">${rack.map(c=>`<span class="tile">${c}</span>`).join('')}</div><p class="small center">Your tiles (${rack.length}) · Use each tile no more than once</p><div class="divider"></div><label>Your move</label><div class="choice-grid"><button class="choice ${g.target===-1?'selected':''}" onclick="App.heistTarget(-1)">✨ Build a new word<small>Use only your letters</small></button>${g.words.filter(w=>w.owner!==who).map(w=>`<button class="choice ${g.target===w.id?'selected':''}" onclick="App.heistTarget(${w.id})">🥷 Steal <strong>${esc(w.text)}</strong><small>From ${esc(g.players[w.owner])} · add at least one tile</small></button>`).join('')}</div><label for="heist-word">${g.target===-1?'New word':'New longer word using ALL stolen letters'}</label><input class="field" id="heist-word" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. STONE" maxlength="24" onkeydown="if(event.key==='Enter')App.heistSubmit()"/>${g.error?`<div class="error">${esc(g.error)}</div>`:''}<div class="actions">${btn('Submit word →','App.heistSubmit()')}${btn('Swap my letters (uses turn)','App.heistSwap()','alt')}</div>`)}
 if(g.phase==='final'){const max=Math.max(...totals);b=win(g.players.filter((_,i)=>totals[i]===max).join(' & ')+' '+(totals.filter(v=>v===max).length>1?'tie!':'wins!'),'Longest words and best heists win the day.',g.players,totals)}
 let words=g.words.length?`<div class="word-list">${g.words.map(w=>`<span class="word-pill"><strong>${esc(w.text)}</strong> · ${esc(g.players[w.owner])}</span>`).join('')}</div>`:'<p class="muted">No words on the table yet.</p>';
 shell(b+panel(`<h3>Words on the table</h3>${words}<h3>Current standings</h3>${scoreboard(g.players,totals)}`,'soft'))}
App.heistReveal=()=>{g.phase='play';render()};
App.heistTarget=i=>{g.target=i;g.error='';render()};
function heistAdvance(){g.turn++;g.target=-1;g.error='';g.phase=g.turn>=g.players.length*g.rounds?'final':'pass';render()}
App.heistSubmit=()=>{if(g.phase!=='play')return;const who=g.turn%g.players.length,word=input('heist-word').toUpperCase().replace(/\s+/g,'');if(!/^[A-Z]{3,24}$/.test(word)){g.error='Enter one English word using at least three letters (A–Z).';render();return}if(g.words.some(w=>w.text===word)){g.error='This exact word is already on the table. Try something different.';render();return}const target=g.target<0?null:g.words.find(w=>w.id===g.target);if(g.target>=0&&!target){g.error='That word is no longer available.';render();return}if(target&&word.length<=target.text.length){g.error='Your stolen word must be longer than the original.';render();return}const needed=differenceWord(word,target?.text||'');if(!needed){g.error='You must use every letter of the word you are stealing.';render();return}const rack=g.racks[who],left=differenceWord(rack.join(''),needed.join(''));if(left===null){g.error='You do not have the extra letters needed. Check your tiles.';render();return}if(!window.confirm(`Group check: is “${word}” a valid English word?`))return;g.racks[who]=left;while(g.racks[who].length<11)g.racks[who].push(drawLetter());if(target){target.text=word;target.owner=who}else g.words.push({id:Date.now()+rand(1e6),text:word,owner:who});announce(g.players[who]+' played '+word);heistAdvance()};
App.heistSwap=()=>{if(!window.confirm('Swap your entire rack and use this turn?'))return;g.racks[g.turn%g.players.length]=drawRack();heistAdvance()};
// 04: MIDNIGHT ALIBIS
function initNight(){let roles=['Shadow'];if(g.players.length>=6)roles.push('Shadow');if(g.players.length>=4)roles.push('Investigator');if(g.players.length>=5)roles.push('Mask Maker');while(roles.length<g.players.length)roles.push('Villager');Object.assign(g,{phase:'rolepass',cursor:0,roles:shuffle(roles),starting:[],nightCursor:0,nightStep:'',peekTarget:-1,swapFirst:-1,votes:[],result:null});g.starting=[...g.roles]}
function renderNight(){let b='';const who=g.cursor;
 if(g.phase==='rolepass')b=pass(g.players[who],'You are about to see your secret role. Do not show anybody.','App.nightShowRole()');
 if(g.phase==='roleshow'){const r=g.starting[who];b=panel(`<div class="center"><div class="round-label">Your secret role</div><div class="secret-card"><div class="display">${r==='Shadow'?'🌑':r==='Investigator'?'🔎':r==='Mask Maker'?'🎭':'🏡'} ${esc(r)}</div><p>${r==='Shadow'?'Avoid being singled out. You win if no Shadow is voted out.':r==='Investigator'?'On your night turn, you may examine another player’s current role.':r==='Mask Maker'?'On your night turn, swap two other players’ current roles secretly.':'Discuss and work out who the Shadows are.'}</p></div><div class="actions center">${btn('Hide my role & pass','App.nightRoleNext()')}</div></div>`)}
 if(g.phase==='nightpass')b=pass(g.players[g.nightCursor],'The night is here. Everyone will get a private turn, including villagers.','App.nightActReveal()');
 if(g.phase==='nightact'){const role=g.starting[g.nightCursor];let inside='';if(role==='Investigator')inside=`<div class="round-label">Investigator’s private action</div><h2>Peek at one player</h2><div class="choice-grid">${g.players.map((p,i)=>i===g.nightCursor?'':`<button class="choice" onclick="App.nightPeek(${i})">🔎 ${esc(p)}</button>`).join('')}</div>`;else if(role==='Mask Maker')inside=`<div class="round-label">Mask Maker’s private action</div><h2>${g.swapFirst<0?'Choose the first person':'Choose the second person'}</h2><p class="muted">You will swap two other players’ current roles. You do not see what they are.</p><div class="choice-grid">${g.players.map((p,i)=>(i===g.nightCursor||i===g.swapFirst)?'':`<button class="choice" onclick="App.nightSwap(${i})">🎭 ${esc(p)}</button>`).join('')}</div>`;else inside=`<div class="center"><div class="round-label">Night phase</div><div class="display">Eyes closed. Shhh.</div><p class="lead">Your original role has no special night action.</p>${btn('Hide & pass the phone','App.nightActionDone()')}</div>`;b=panel(inside)}
 if(g.phase==='nightpeek')b=panel(`<div class="center"><div class="round-label">Investigator’s discovery</div><div class="display">${esc(g.players[g.peekTarget])}</div><div class="secret-card"><div class="display">${esc(g.roles[g.peekTarget])}</div></div><p class="muted">Remember this. The Mask Maker may change roles afterwards.</p>${btn('Hide and continue','App.nightActionDone()')}</div>`);
 if(g.phase==='discuss')b=panel(`<div class="center"><div class="round-label">Dawn has broken</div><div class="display">Who is lying?</div><p class="lead">You have all completed your night actions. Talk, accuse, defend and bluff. When ready, vote out one suspicious player.</p>${btn('Start secret vote →','App.nightVoteStart()')}</div>`);
 if(g.phase==='votepass')b=pass(g.players[g.cursor],'You will privately vote for one suspected Shadow, or abstain.','App.nightVoteReveal()');
 if(g.phase==='vote')b=panel(`<div class="round-label">Secret vote · ${esc(g.players[g.cursor])}</div><h2>Who is a Shadow?</h2><div class="choice-grid">${g.players.map((p,i)=>i===g.cursor?'':`<button class="choice" onclick="App.nightVote(${i})">${esc(p)}</button>`).join('')}<button class="choice" onclick="App.nightVote(-1)">🤷 No one</button></div>`);
 if(g.phase==='result'){const votes=g.players.map((_,i)=>g.votes.filter(x=>x===i).length),max=Math.max(...votes),leaders=votes.map((v,i)=>v===max&&v>0?i:-1).filter(i=>i>=0),winVillage=leaders.length===1&&g.roles[leaders[0]]==='Shadow';b=panel(`<div class="center"><div class="round-label">Night over</div><div class="display winner">${winVillage?'🌅 Village wins!':'🌑 Shadows win!'}</div><p class="lead">${leaders.length===1?esc(g.players[leaders[0]])+' received the most votes.':'A tie or abstentions meant nobody was eliminated.'}</p><div class="scoreboard">${g.players.map((p,i)=>`<div class="score"><span>${esc(p)}</span><strong style="font-size:1rem">${esc(g.roles[i])}</strong><span>${votes[i]} votes</span></div>`).join('')}</div>${btn('Another night','App.restart()')}</div>`)}
 shell(b)}
App.nightShowRole=()=>{g.phase='roleshow';render()};
App.nightRoleNext=()=>{g.cursor++;if(g.cursor>=g.players.length){g.phase='nightpass';g.nightCursor=0}else g.phase='rolepass';render()};

App.nightPeek=i=>{g.peekTarget=i;g.phase='nightpeek';render()};
App.nightSwap=i=>{if(g.swapFirst<0){g.swapFirst=i;render();return}const x=g.roles[i];g.roles[i]=g.roles[g.swapFirst];g.roles[g.swapFirst]=x;g.swapFirst=-1;g.phase='nightDone';shell(panel(`<div class="center"><div class="display">Masks swapped.</div><p class="lead">Nobody knows what changed. Do not reveal your action.</p>${btn('Hide & pass','App.nightActionDone()')}</div>`))};
App.nightActionDone=()=>{g.nightCursor++;g.phase=g.nightCursor>=g.players.length?'discuss':'nightpass';render()};
App.nightVoteStart=()=>{g.cursor=0;g.phase='votepass';render()};
App.nightVoteReveal=()=>{g.phase='vote';render()};
App.nightVote=i=>{g.votes.push(i);g.cursor++;g.phase=g.cursor>=g.players.length?'result':'votepass';render()};
// 05: BLUFF & BLOOM
const alive=()=>g.players.map((_,i)=>i).filter(i=>g.tokens[i].length>0);
function initBloom(){Object.assign(g,{phase:'placepass',cursor:0,layer:1,tokens:g.players.map(()=>['Rose','Rose','Rose','Thorn']),stacks:g.players.map(()=>[]),points:g.players.map(()=>0),round:1,bid:0,bidCursor:0,leader:-1,bidActive:[],flips:[],safe:0,outcome:'',finished:false})}
function bloomAvailable(i){const left=[...g.tokens[i]];for(const placed of g.stacks[i]){const index=left.indexOf(placed);if(index>=0)left.splice(index,1)}return left}
function beginBloomBids(){g.phase='bid';g.bid=0;g.leader=-1;g.bidActive=g.players.map((_,i)=>g.tokens[i].length>0);g.bidCursor=alive()[0]??0;render()}
function nextBloomPlace(){const remaining=alive().filter(i=>i>g.cursor);if(remaining.length){g.cursor=remaining[0];g.phase=g.layer===1?'placepass':'secondpass'}else if(g.layer===1){g.layer=2;g.cursor=alive()[0];g.phase='secondpass'}else{beginBloomBids();return}render()}
function bloomNextBid(current){const opts=alive().filter(i=>g.bidActive[i]&&i!==g.leader);if(!opts.length){g.phase='reveal';g.flips=g.players.map(()=>0);g.safe=0;render();return}let next=opts.find(i=>i>current);if(next===undefined)next=opts[0];g.bidCursor=next;render()}
function finishBloom(success,detail){if(success){g.points[g.leader]++;g.outcome=`${g.players[g.leader]} did it! ${detail} +1 point.`}else{const list=g.tokens[g.leader];const removed=rand(list.length);const lost=list.splice(removed,1)[0];g.outcome=`${g.players[g.leader]} hit a Thorn. ${detail} One random tile (${lost}) was lost permanently.`}g.phase='outcome';if(g.points.some(x=>x>=2)||alive().length<2)g.finished=true;render()}
function renderBloom(){const count=g.stacks.reduce((sum,st)=>sum+st.length,0);let b='';
 if(g.phase==='placepass')b=pass(g.players[g.cursor],`Round ${g.round}: secretly choose your ${g.layer===1?'first':'second'} tile. Others should look away.`,'App.bloomShowPlace()');
 if(g.phase==='place'){const av=bloomAvailable(g.cursor);const r=av.filter(x=>x==='Rose').length,t=av.filter(x=>x==='Thorn').length;b=panel(`<div class="center"><div class="round-label">Private tile · ${esc(g.players[g.cursor])}</div><h2>Choose a tile to hide</h2><p class="muted">Only you can see the tile you are placing. All other players see only the size of your stack.</p><div class="choice-grid">${r?`<button class="choice" onclick="App.bloomPlace('Rose')" style="text-align:center;font-size:1.4rem">🌹 Rose<small>${r} left this round</small></button>`:''}${t?`<button class="choice" onclick="App.bloomPlace('Thorn')" style="text-align:center;font-size:1.4rem">🌵 Thorn<small>${t} left this round</small></button>`:''}</div></div>`)}
 if(g.phase==='secondpass')b=panel(`<div class="center"><div class="round-label">Private choice · ${esc(g.players[g.cursor])}</div><h2>Add a second hidden tile?</h2><p class="lead">Adding a second tile makes a larger stack for everyone to challenge. You may also stop now.</p><div class="actions center">${btn('Add another tile','App.bloomSecond(true)')}${btn('No thanks, pass','App.bloomSecond(false)','alt')}</div></div>`);
 if(g.phase==='bid'){const available=Array.from({length:Math.min(count-g.bid,5)},(_,i)=>g.bid+i+1);if(count>g.bid+5)available.push(count);b=panel(`<div class="round-label">Challenge round · ${esc(g.players[g.bidCursor])} to bid</div><h2>How many Roses can you reveal?</h2><div class="statbar"><span class="stat">Tiles face down: <strong>${count}</strong></span><span class="stat">Current bid: <strong>${g.bid||'none'}</strong></span><span class="stat">Leading: <strong>${g.leader<0?'no one':esc(g.players[g.leader])}</strong></span></div><p class="muted">Raise above the current bid or pass. Once you pass you are out of this round’s bidding.</p><div class="choice-grid">${available.map(x=>`<button class="choice" onclick="App.bloomBid(${x})">I can flip <strong>${x}</strong> Roses</button>`).join('')}</div><div class="actions">${btn('Pass on bidding','App.bloomPass()','alt'+(!g.bid?' disabled':''))}</div>`);if(!g.bid)b=b.replace('class="btn alt disabled"','class="btn alt" disabled')}
 if(g.phase==='reveal'){const ownRemain=g.flips[g.leader]<g.stacks[g.leader].length;const needed=g.bid-g.safe;b=panel(`<div class="center"><div class="round-label">${esc(g.players[g.leader])} accepted the challenge</div><div class="display">${g.safe} / ${g.bid} 🌹</div><p class="lead">${ownRemain?'You must reveal every tile in your own stack first.':'Pick a stack to reveal its top tile. You need '+needed+' more Rose'+(needed===1?'':'s')+'!'}</p></div><div class="stacks">${g.players.map((p,i)=>{const left=g.stacks[i].length-g.flips[i];return `<div class="stack"><strong>${esc(p)}</strong><div class="stack-art">${left?'🂠'.repeat(Math.min(left,3)):'—'}</div><div class="tiny">${left} hidden</div>${left&&(!ownRemain||i===g.leader)?btn('Reveal top','App.bloomFlip('+i+')','sm'):''}</div>`}).join('')}</div>`)}
 if(g.phase==='outcome')b=panel(`<div class="center"><div class="round-label">Challenge result</div><div class="display">${g.outcome.includes('did it')?'🌹 SUCCESS':'🌵 OUCH'}</div><p class="lead">${esc(g.outcome)}</p>${g.finished?`${btn('See the winner','App.bloomNext()')}`:`${btn('Next round →','App.bloomNext()')}`}</div>`);
 if(g.phase==='final'){const winner=g.points.some(x=>x>=2)?g.players[g.points.indexOf(Math.max(...g.points))]:g.players[alive()[0]];b=win(winner+' wins!','The sharpest bluffer takes the crown.',g.players,g.points)}
 if(['placepass','place','secondpass','bid'].includes(g.phase))b+=panel(`<h3>Face-down stacks</h3><div class="stacks">${g.players.map((p,i)=>`<div class="stack"><strong>${esc(p)}</strong><div class="stack-art">${g.stacks[i].length?'🂠'.repeat(g.stacks[i].length):'—'}</div><div class="tiny">${g.stacks[i].length} placed</div></div>`).join('')}</div><h3>Points (first to two)</h3>${scoreboard(g.players,g.points)}`,'soft');
 shell(b)}
App.bloomShowPlace=()=>{g.phase='place';render()};
App.bloomPlace=type=>{const av=bloomAvailable(g.cursor);if(!av.includes(type))return;g.stacks[g.cursor].push(type);nextBloomPlace()};
App.bloomSecond=add=>{if(add&&bloomAvailable(g.cursor).length){g.phase='placepass';render()}else nextBloomPlace()};
App.bloomBid=amount=>{if(g.phase!=='bid'||amount<=g.bid||amount>g.stacks.reduce((a,b)=>a+b.length,0))return;g.bid=amount;g.leader=g.bidCursor;g.bidActive[g.leader]=true;const total=g.stacks.reduce((a,b)=>a+b.length,0);if(amount>=total){g.flips=g.players.map(()=>0);g.safe=0;g.phase='reveal';render()}else bloomNextBid(g.bidCursor)};
App.bloomPass=()=>{if(!g.bid)return;g.bidActive[g.bidCursor]=false;bloomNextBid(g.bidCursor)};
App.bloomFlip=i=>{if(g.phase!=='reveal')return;const ownLeft=g.flips[g.leader]<g.stacks[g.leader].length;if(ownLeft&&i!==g.leader)return;const pile=g.stacks[i],num=g.flips[i];if(num>=pile.length)return;const type=pile[pile.length-num-1];g.flips[i]++;if(type==='Thorn'){finishBloom(false,`${g.safe} safe Rose${g.safe===1?'':'s'} revealed.`)}else{g.safe++;if(g.safe>=g.bid)finishBloom(true,`${g.safe} Roses revealed without a Thorn.`);else{announce('Rose! '+g.safe+' of '+g.bid);render()}}};
App.bloomNext=()=>{if(g.finished){g.phase='final';render();return}g.round++;g.stacks=g.players.map(()=>[]);g.cursor=alive()[0];g.layer=1;g.phase='placepass';render()};
// 06: FACT TRAP
function initFact(){Object.assign(g,{phase:'authorpass',round:0,maxRounds:5,money:g.players.map(()=>10),facts:shuffle(FACTS),factIndex:0,skips:0,votes:[],answers:[],author:0,voterCursor:0,bet:1,error:''})}
function currentFact(){return g.facts[g.factIndex]}
function advanceFactQuestion(){const previous=currentFact()?.q;g.factIndex++;if(g.factIndex>=g.facts.length){g.facts=shuffle(FACTS);if(g.facts.length>1&&g.facts[0].q===previous)g.facts.push(g.facts.shift());g.factIndex=0}}
function factVoterNext(){const others=g.players.map((_,i)=>i).filter(i=>i!==g.author);const next=others.find(i=>i>g.voterCursor);if(next===undefined){g.phase='result'}else{g.voterCursor=next;g.phase='votepass';g.bet=Math.max(0,Math.min(1,g.money[next]))}render()}
function renderFact(){const question=currentFact(),author=g.author;let b='';
 const skip=btn('↻ Skip this question','App.factSkip()','alt');
 if(g.phase==='authorpass')b=panel(`<div class="center"><div class="round-label">Round ${g.round+1}/${g.maxRounds} · ${esc(question.tag)}</div><div class="display">📱 → ${esc(g.players[author])}</div><p class="lead">You're writing two believable lies. Have a look at the question privately—or skip it for another, free of charge.</p><div class="actions center">${btn('I have the phone →','App.factShowAuthor()')}${skip}</div>${g.skips?`<p class="tiny">${g.skips} question${g.skips===1?'':'s'} skipped this game</p>`:''}</div>`);
 if(g.phase==='authorwrite')b=panel(`<div class="round-label">Author's eyes only · ${esc(question.tag)}</div><h2>${esc(question.q)}</h2><div class="secret-card"><div class="small">The ACTUAL answer is</div><div class="display">${esc(question.answer)}</div></div><p class="lead">Write two believable (or hilariously plausible) fake answers. Your friends will bet on which one is true.</p><label for="fake1">Fake answer 1</label><input id="fake1" class="field" maxlength="90" autocomplete="off" placeholder="A convincing lie"/><label for="fake2">Fake answer 2</label><input id="fake2" class="field" maxlength="90" autocomplete="off" placeholder="A different convincing lie"/>${g.error?`<p class="error">${esc(g.error)}</p>`:''}<div class="actions">${btn('Shuffle answers & start betting →','App.factAuthorSubmit()')}${skip}</div><p class="tiny">Skipping changes the question, not the round, and costs no chips.</p>`);
 if(g.phase==='votepass')b=pass(g.players[g.voterCursor],`Round ${g.round+1}. Choose which answer is real and bet some of your ${g.money[g.voterCursor]} chips.`,'App.factVoteReveal()');
 if(g.phase==='vote'){const money=g.money[g.voterCursor];b=panel(`<div class="round-label">Secret wager · ${esc(g.players[g.voterCursor])}</div><div class="small">${esc(question.tag)}</div><h2>${esc(question.q)}</h2><p class="lead">Only one of these is true. You have <strong>${money}</strong> chips.</p>${money>0?`<label>Your wager</label><div class="actions">${[1,2,3].filter(n=>n<=money).map(n=>`<button class="btn ${g.bet===n?'':'alt'} sm" onclick="App.factBet(${n})">${n} chip${n===1?'':'s'}</button>`).join('')}</div><h3 style="margin-top:20px">Pick your answer</h3>${g.answers.map((v,i)=>`<button class="fact-option" onclick="App.factVote(${i})">${String.fromCharCode(65+i)}. ${esc(v.text)}</button>`).join('')}`:`<div class="notice">You're out of chips, so you must skip this wager.</div>${btn('Skip this wager →','App.factVote(-1)')}`}`)}
 if(g.phase==='result'){const correct=g.answers.find(x=>x.real),correctCount=g.votes.filter(v=>v.real).length;const fooled=g.votes.filter(v=>!v.real&&!v.skipped).length;b=panel(`<div class="center"><div class="round-label">Round ${g.round+1} revealed · ${esc(question.tag)}</div><h2>${esc(question.q)}</h2><div class="display winner">${esc(correct.text)}</div><p class="lead">${correctCount} player${correctCount===1?'':'s'} found the truth. ${fooled} fell for the author's lies.</p><div class="notice" style="text-align:left"><strong>Wait, that's actually true?</strong><p style="margin:5px 0 0">${esc(question.why)}</p></div><div class="word-list">${g.answers.map(x=>`<span class="word-pill">${x.real?'✅ TRUE':'🎭 FAKE'}: ${esc(x.text)}</span>`).join('')}</div><div class="divider"></div><h3>Chips</h3>${scoreboard(g.players,g.money)}${btn(g.round===g.maxRounds-1?'See final winner':'Next round →','App.factNext()')}</div>`)}
 if(g.phase==='final'){const max=Math.max(...g.money);b=win(g.players.filter((_,i)=>g.money[i]===max).join(' & ')+' '+(g.money.filter(x=>x===max).length===1?'wins!':'tie!'),'The best poker face, smartest wager or most believable lies.',g.players,g.money)}
 shell(b)}
App.factShowAuthor=()=>{if(g.phase!=='authorpass')return;g.phase='authorwrite';render()};
App.factSkip=()=>{if(g.id!=='fact'||!['authorpass','authorwrite'].includes(g.phase))return;advanceFactQuestion();g.skips++;g.error='';g.answers=[];g.votes=[];g.phase='authorpass';render()};
App.factAuthorSubmit=()=>{if(g.phase!=='authorwrite')return;const one=input('fake1'),two=input('fake2'),truth=currentFact().answer;if([one,two].some(x=>x.length<2)||norm(one)===norm(two)||norm(one)===norm(truth)||norm(two)===norm(truth)){g.error='Write two distinct fake answers that differ from the truth (at least 2 characters).';const err=$('fact-error');if(err)err.textContent=g.error;else{const target=$('fake2');if(target)target.insertAdjacentHTML('afterend',`<div class="error" id="fact-error">${esc(g.error)}</div>`)}return}g.error='';g.answers=shuffle([{text:truth,real:true},{text:one,real:false},{text:two,real:false}]);g.votes=[];g.voterCursor=g.players.map((_,i)=>i).find(i=>i!==g.author);g.bet=Math.min(1,g.money[g.voterCursor]);g.phase='votepass';render()};
App.factVoteReveal=()=>{if(g.phase!=='votepass')return;g.phase='vote';render()};
App.factBet=n=>{if(g.phase!=='vote'||n>g.money[g.voterCursor]||n<1)return;g.bet=n;render()};
App.factVote=i=>{if(g.phase!=='vote'||(i!==-1&&!g.answers[i]))return;const p=g.voterCursor,bet=i===-1?0:g.bet,selected=g.answers[i];if(bet>g.money[p])return;if(bet){if(selected.real){g.money[p]+=bet}else{g.money[p]-=bet;g.money[g.author]+=bet}}g.votes.push({player:p,bet,real:!!selected?.real,skipped:!bet});factVoterNext()};
App.factNext=()=>{if(g.phase!=='result')return;g.round++;if(g.round>=g.maxRounds){g.phase='final'}else{advanceFactQuestion();g.author=g.round%g.players.length;g.phase='authorpass';g.answers=[];g.votes=[]}render()};
// 07: TRIPLE CLUE DASH
function initTriple(){Object.assign(g,{phase:'ready',round:0,maxRounds:10,cards:shuffle(TRIPLE),points:g.players.map(()=>0),claim:-1,correct:false})}
function renderTriple(){const c=g.cards[g.round];let b='';
 if(g.phase==='ready')b=panel(`<div class="center"><div class="round-label">Round ${g.round+1} / ${g.maxRounds} · ${esc(c.tag)}</div><div class="display">Ready for a weird one?</div><p class="lead">A ridiculous scenario. Three rules. First to shout an answer that fits all three wins a point. Short phrases count too!</p>${btn('Show the clues · 30 seconds','App.tripleStart()')}</div>`);
 if(g.phase==='play')b=panel(`<div class="center"><div class="round-label">Round ${g.round+1}/${g.maxRounds} · ${esc(c.tag)}</div>${timeHtml()}<div class="condition-row"><div class="condition">${esc(c.a)}</div><div class="condition">${esc(c.b)}</div><div class="condition">${esc(c.c)}</div></div><p class="lead" style="margin-top:22px">Who shouted a fitting answer first?</p><div class="choice-grid">${g.players.map((p,i)=>`<button class="choice" onclick="App.tripleClaim(${i})">⚡ ${esc(p)}</button>`).join('')}</div><div class="actions center">${btn('Nobody got it · reveal →','App.triplePass()','alt sm')}</div></div>`);
 if(g.phase==='judge')b=panel(`<div class="center"><div class="round-label">Judging ${esc(g.players[g.claim])}'s answer · ${esc(c.tag)}</div><h2>Did it fit ALL THREE clues?</h2><div class="condition-row"><div class="condition">${esc(c.a)}</div><div class="condition">${esc(c.b)}</div><div class="condition">${esc(c.c)}</div></div><div class="actions center">${btn('Yes, +1 point','App.tripleJudge(true)')}${btn('No, −1 point','App.tripleJudge(false)','danger')}</div></div>`);
 if(g.phase==='between')b=panel(`<div class="center"><div class="round-label">Round ${g.round+1} · ${esc(c.tag)}</div><div class="display">${g.claim<0?'🎭 Nobody got it':g.correct?'✅ Great answer!':'❌ Creative, but no'}</div><p class="lead">One possible answer: <strong>${esc(c.sample)}</strong></p><p class="tiny">Other answers are fine if the group agrees they fit.</p>${scoreboard(g.players,g.points)}${btn(g.round===g.maxRounds-1?'See winner →':'Next clue →','App.tripleNext()')}</div>`);
 if(g.phase==='final'){const max=Math.max(...g.points);b=win(g.players.filter((_,i)=>g.points[i]===max).join(' & ')+' '+(g.points.filter(x=>x===max).length>1?'tie!':'wins!'),'Fast brains and quick mouths win.',g.players,g.points)}
 shell(b)}
App.tripleStart=()=>{if(g.phase!=='ready')return;g.phase='play';clock(30,()=>{g.claim=-1;g.phase='between';render()});render()};
App.tripleClaim=i=>{if(g.phase!=='play'||!g.players[i])return;clearClock();g.claim=i;g.phase='judge';render()};
App.triplePass=()=>{if(g.phase!=='play')return;clearClock();g.claim=-1;g.phase='between';render()};
App.tripleJudge=correct=>{if(g.phase!=='judge')return;g.correct=correct;g.points[g.claim]+=correct?1:-1;g.phase='between';render()};
App.tripleNext=()=>{if(g.phase!=='between')return;g.round++;g.phase=g.round>=g.maxRounds?'final':'ready';g.claim=-1;g.correct=false;render()};
// 08: PATTERN PANIC
const SHAPES=['◆','●','▲','★'];const COLORS=['#ff8d80','#a6baff','#e4d57b','#b9ed9d'];
function patternRandom(){return{shape:rand(SHAPES.length),color:rand(COLORS.length),num:1+rand(3)}}
function patternMatches(a,b){return Number(a.shape===b.shape)+Number(a.color===b.color)+Number(a.num===b.num)}
function newPattern(){g.target=patternRandom();let yes=[],no=[];let tries=0;while((yes.length<4||no.length<8)&&tries++<2000){const t=patternRandom(),m=patternMatches(t,g.target);if(m>=2&&yes.length<4)yes.push(t);else if(m<2&&no.length<8)no.push(t)}g.board=shuffle([...yes,...no]);}
function initPattern(){Object.assign(g,{phase:'pass',turn:0,points:g.players.map(()=>0),hits:0,misses:0,target:null,board:[]})}
function patternTile(p){return `<div class="pattern-symbols" style="color:${COLORS[p.color]}">${Array.from({length:p.num},()=>SHAPES[p.shape]).join(' ')}</div>`}
function renderPattern(){let b='';
 if(g.phase==='pass')b=pass(g.players[g.turn],`Your 45-second turn is next. Tap tiles matching any two or all three traits. The others should cheer you on.`,'App.patternStart()');
 if(g.phase==='play')b=panel(`<div class="center"><div class="round-label">${esc(g.players[g.turn])} · Find two matching attributes</div>${timeHtml()}<p class="small">Match at least 2 of: symbol · colour · number of symbols</p><div class="pattern-target"><div class="round-label">Your target</div>${patternTile(g.target)}</div></div><div class="pattern-board" style="margin-top:15px">${g.board.map((p,i)=>`<button class="pattern-tile" aria-label="Pattern tile ${i+1}" onclick="App.patternTap(${i})">${patternTile(p)}</button>`).join('')}</div><div class="statbar" style="margin-top:15px"><span class="stat">Score: <strong>${g.points[g.turn]}</strong></span><span class="stat">Correct: <strong>${g.hits}</strong></span><span class="stat">Mistakes: <strong>${g.misses}</strong></span></div>`);
 if(g.phase==='turnend')b=panel(`<div class="center"><div class="round-label">Time’s up!</div><div class="display">${esc(g.players[g.turn])}: ${g.points[g.turn]}</div><p class="lead">${g.hits} matches and ${g.misses} missed taps.</p>${btn(g.turn===g.players.length-1?'See final winner →':'Next player →','App.patternNext()')}</div>`);
 if(g.phase==='final'){const max=Math.max(...g.points);b=win(g.players.filter((_,i)=>g.points[i]===max).join(' & ')+' '+(g.points.filter(x=>x===max).length>1?'tie!':'wins!'),'Speed, sharp eyes and staying cool under pressure.',g.players,g.points)}
 if(g.phase!=='play')b+=panel(`<h3>Standings</h3>${scoreboard(g.players,g.points,g.turn)}`,'soft');shell(b)}
App.patternStart=()=>{g.phase='play';g.hits=0;g.misses=0;newPattern();clock(45,()=>{g.phase='turnend';render()});render()};
App.patternTap=i=>{if(g.phase!=='play')return;const p=g.board[i];if(!p)return;if(patternMatches(p,g.target)>=2){g.points[g.turn]+=2;g.hits++;newPattern();announce('Correct!')}else{g.points[g.turn]=Math.max(0,g.points[g.turn]-1);g.misses++;announce('Not a match')}render()};
App.patternNext=()=>{g.turn++;g.phase=g.turn>=g.players.length?'final':'pass';render()};

// 09: CUTOUT CHAOS — finger-cut silhouettes, no physical supplies required.
function initCuts(){Object.assign(g,{phase:'pass',turn:0,maxTurns:g.players.length*2,points:g.players.map(()=>0),prompts:shuffle(CUT_PROMPTS),cuts:[],activePath:null,gallery:[],guesser:-1})}
function cutsCutter(){return g.turn%g.players.length}
function cutsPrompt(){return g.prompts[g.turn%g.prompts.length]}
function cutsPath(points){if(!points||points.length<2)return '';return 'M'+points.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' Z'}
function cutsSVG(parts,canDraw=false){return `<svg ${canDraw?'id="cut-pad"':''} class="cut-sheet ${canDraw?'drawing':''}" viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${canDraw?'Draw your cut-paper silhouette here':'Cut-paper silhouette'}"><rect width="500" height="360" rx="10" fill="#fff9ee"/><g id="cut-pieces">${parts.map((pts,i)=>`<path d="${cutsPath(pts)}" fill="${['#ff9c88','#7acbbd','#d0adff','#ffdf89'][i%4]}"/>`).join('')}</g>${canDraw?'<g id="cut-preview"></g>':''}</svg>`}
function paintCuts(){const svg=$('cut-pad');if(!svg)return;const grp=$('cut-pieces'),preview=$('cut-preview');if(grp)grp.innerHTML=g.cuts.map((pts,i)=>`<path d="${cutsPath(pts)}" fill="${['#ff9c88','#7acbbd','#d0adff','#ffdf89'][i%4]}"/>`).join('');if(preview)preview.innerHTML=g.activePath?.length>2?`<path d="${cutsPath(g.activePath)}" fill="#8ccfd3" fill-opacity=".78" stroke="#363047"/>`:'';}
function bindCuts(){const svg=$('cut-pad');if(!svg||svg.dataset.bound)return;svg.dataset.bound='1';let drawing=false;const point=e=>{const r=svg.getBoundingClientRect();return [Math.max(0,Math.min(500,(e.clientX-r.left)*500/r.width)),Math.max(0,Math.min(360,(e.clientY-r.top)*360/r.height))]};svg.addEventListener('pointerdown',e=>{if(g?.id!=='cuts'||g.phase!=='cut')return;e.preventDefault();drawing=true;g.activePath=[point(e)];svg.setPointerCapture(e.pointerId);paintCuts()});svg.addEventListener('pointermove',e=>{if(!drawing||g?.phase!=='cut')return;e.preventDefault();const p=point(e),last=g.activePath[g.activePath.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])>2){g.activePath.push(p);paintCuts()}});const finish=e=>{if(!drawing)return;drawing=false;if(g?.phase==='cut'&&g.activePath?.length>=3){g.cuts.push(g.activePath.slice())}g.activePath=null;paintCuts()};svg.addEventListener('pointerup',finish);svg.addEventListener('pointercancel',finish)}
function cutsGoGuess(){if(g.phase!=='cut')return;clearClock();g.activePath=null;g.phase='guess';clock(30,()=>App.cutsJudge(-1));render()}
function renderCuts(){const artist=cutsCutter(),prompt=cutsPrompt(),who=g.players[artist];let b='';
if(g.phase==='pass')b=pass(who,`You're the artist for round ${g.turn+1} of ${g.maxTurns}. Keep the secret object hidden. Cut shapes on the phone with your finger. Then hand it to the guessers.`,'App.cutsBegin()');
if(g.phase==='cut')b=panel(`<div class="center"><div class="round-label">Round ${g.turn+1}/${g.maxTurns} · Only ${esc(who)} looks</div>${timeHtml()}<div class="display" style="font-size:clamp(1.5rem,4.8vw,2.7rem)">${esc(prompt)}</div><p class="small">Trace a closed outline with your finger or mouse; lift to cut out a shape. Add more shapes to build it. Keep the answer secret.</p></div>${cutsSVG(g.cuts,true)}<div class="actions center">${btn('↶ Undo last cut','App.cutsUndo()','alt sm')}${btn('Clear paper','App.cutsClear()','alt sm')}${btn('Show cutout to guessers →','App.cutsShow()')}</div><p class="tiny">No need for scissors or paper. Try creating the shape without writing or spelling words.</p>`);
if(g.phase==='guess')b=panel(`<div class="center"><div class="round-label">Guess the cutout · No hints from ${esc(who)}!</div>${timeHtml()}<h2>What did they make?</h2>${cutsSVG(g.cuts)}<p class="lead" style="margin-top:22px">Who guessed it first? (The artist earns 2 points; the guesser earns 1.)</p><div class="choice-grid">${g.players.map((name,i)=>i===artist?'':`<button class="choice" onclick="App.cutsJudge(${i})">✓ ${esc(name)}</button>`).join('')}</div><div class="actions center">${btn('Nobody got it · reveal →','App.cutsJudge(-1)','alt sm')}</div></div>`);
if(g.phase==='between')b=panel(`<div class="center"><div class="round-label">Round ${g.turn+1} revealed</div><h2>The answer was…</h2><div class="display">${esc(prompt)}</div><p class="lead">${g.guesser<0?'Nobody guessed correctly.':esc(who)+' gets 2 points, '+esc(g.players[g.guesser])+' gets 1 point!'}</p>${scoreboard(g.players,g.points)}${btn(g.turn===g.maxTurns-1?'See gallery & winner →':'Next artist →','App.cutsNext()')}</div>`);
if(g.phase==='final'){const best=Math.max(...g.points);b=win(g.players.filter((_,i)=>g.points[i]===best).join(' & ')+' '+(g.points.filter(x=>x===best).length>1?'tie!':'wins!'),'Everyone made something questionable. Here is your gallery of paper nightmares.',g.players,g.points)+panel(`<h3>Tonight's cutout gallery</h3><div class="cut-gallery">${g.gallery.map(x=>`<div class="cut-gallery-item">${cutsSVG(x.cuts)}<strong>${esc(x.prompt)}</strong><span class="tiny">${esc(x.artist)} · ${x.guessed?'Guessed!':'Stumped everyone'}</span></div>`).join('')}</div>`)}
shell(b);if(g.phase==='cut')bindCuts()}
App.cutsBegin=()=>{if(g.phase!=='pass')return;g.phase='cut';g.cuts=[];clock(75,cutsGoGuess);render()};
App.cutsShow=cutsGoGuess;

function initFood(){Object.assign(g,{phase:'ready',round:0,maxRounds:12,questions:shuffle(FOOD_QUIZ).map(q=>({...q,choices:shuffle([q.a,...q.wrong])})),scores:[0,0],buzz:-1,first:-1,steal:-1,correctTeam:-1})}

function renderFood(){const q=foodQuestion();let b='';
const st=`<div class="statbar"><span class="stat">Question <strong>${Math.min(g.round+1,g.maxRounds)} / ${g.maxRounds}</strong></span><span class="stat">Team A: <strong>${g.scores[0]}</strong></span><span class="stat">Team B: <strong>${g.scores[1]}</strong></span></div>`;
if(g.phase==='ready')b=panel(`<div class="center"><div class="round-label">Two teams · Twelve ridiculous food questions</div><div class="display">Hungry for a fight?</div><p class="lead">Tap a team buzzer before choosing an answer. Wrong answer? Your rivals get a chance to steal. Alternate player names go into Team A and Team B.</p>${foodTeamNames().map((t,i)=>`<p class="small"><strong>Team ${i?'B':'A'}:</strong> ${playersText(t)}</p>`).join('')}${btn('Serve the first question →','App.foodStart()')}</div>`);

if(g.phase==='answer')b=panel(`${st}<div class="center"><div class="round-label">Team ${g.buzz?'B':'A'} buzzed first!</div><h2>${esc(q.q)}</h2><p class="lead">Choose an answer for 2 points. If you're wrong, the other team gets a steal chance.</p>${foodOptions('App.foodAnswer')}</div>`);
if(g.phase==='steal')b=panel(`${st}<div class="center"><div class="round-label">Steal opportunity · Team ${g.steal?'B':'A'}</div><h2>${esc(q.q)}</h2><p class="lead">The first team chose <strong>${esc(q.choices[g.first])}</strong>, but it was wrong. Pick one of the remaining three answers for 1 point.</p>${foodOptions('App.foodSteal',g.first)}${btn('Pass on the steal →','App.foodSkipSteal()','alt')}</div>`);
if(g.phase==='result')b=panel(`${st}<div class="center"><div class="round-label">The delicious truth</div><h2>${esc(q.q)}</h2><div class="display winner" style="font-size:clamp(1.6rem,5vw,2.8rem)">✅ ${esc(q.a)}</div><div class="notice" style="text-align:left">${esc(q.why)}</div><p class="lead">${g.correctTeam===-1?'No points this round.':`Team ${g.correctTeam?'B':'A'} scored ${g.correctTeam===g.buzz?2:1} point${g.correctTeam===g.buzz?'s':''}!`}</p>${scoreboard(['Team A','Team B'],g.scores)}${btn(g.round===g.maxRounds-1?'Show the winner →':'Next food question →','App.foodNext()')}</div>`);
if(g.phase==='final'){const title=g.scores[0]===g.scores[1]?'A delicious draw!':`Team ${g.scores[0]>g.scores[1]?'A':'B'} wins!`;b=win(title,'You have proved that food knowledge is a surprisingly competitive personality trait.',['Team A','Team B'],g.scores)}

App.foodStart=()=>{if(g.phase!=='ready')return;g.phase='ask';clock(40,()=>{g.correctTeam=-1;g.phase='result';render()});render()};
App.foodBuzz=team=>{if(g.phase!=='ask'||![0,1].includes(team))return;clearClock();g.buzz=team;g.phase='answer';render()};
// If a player accidentally taps an option before buzzing, ignore it.
App.foodPass=()=>{if(g.phase!=='ask')return;clearClock();g.correctTeam=-1;g.phase='result';render()};
App.foodAnswer=i=>{if(g.phase!=='answer'||!foodQuestion().choices[i])return;g.first=i;if(foodQuestion().choices[i]===foodQuestion().a){g.scores[g.buzz]+=2;g.correctTeam=g.buzz;g.phase='result'}else{g.steal=1-g.buzz;g.correctTeam=-1;g.phase='steal'}render()};
App.foodSteal=i=>{if(g.phase!=='steal'||i===g.first||!foodQuestion().choices[i])return;if(foodQuestion().choices[i]===foodQuestion().a){g.scores[g.steal]+=1;g.correctTeam=g.steal}g.phase='result';render()};
App.foodSkipSteal=()=>{if(g.phase!=='steal')return;g.phase='result';render()};

const CATEGORY_LETTERS='ABCDEFGHIKLMNOPRSTUW'.split('');
function initCategory(){Object.assign(g,{phase:'intro',deck:shuffle(CATEGORY_LISTS.map((_,i)=>i))[0],round:0,roundMax:3,letter:'',usedLetters:[],cursor:0,seconds:120,answers:[],invalid:[],points:g.players.map(()=>0),mode:'shared'})}
function categoryStartRound(){const options=CATEGORY_LETTERS.filter(c=>!g.usedLetters.includes(c));g.letter=pick(options.length?options:CATEGORY_LETTERS);g.usedLetters.push(g.letter);g.answers=g.players.map(()=>Array(12).fill(''));g.invalid=g.players.map(()=>Array(12).fill(false));g.cursor=0;g.phase='pass';render()}
function categoryClean(v){return String(v||'').trim().toLocaleLowerCase().replace(/^(a|an|the)\s+/i,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function categoryStarts(v){return String(v||'').trim().replace(/^(a|an|the)\s+/i,'').toUpperCase().startsWith(g.letter)}
function categoryValid(player,cat){const a=g.answers[player][cat];if(!a||!categoryStarts(a)||g.invalid[player][cat])return false;const normalized=categoryClean(a);return !g.answers[player].some((v,i)=>i!==cat&&categoryClean(v)===normalized)}
function categoryAnswerPoints(a){const words=String(a).trim().replace(/^(a|an|the)\s+/i,'').split(/[\s-]+/);return Math.max(1,words.filter(w=>w.toUpperCase().startsWith(g.letter)).length)}

function categorySummary(){const scores=categoryScores();return g.points.map((p,i)=>p+scores[i])}
function renderCategory(){let b='',categories=CATEGORY_LISTS[g.deck];
 if(g.phase==='intro')b=panel(`<div class="center"><div class="round-label">12 categories · 3 rounds · one letter at a time</div><div class="display">Think different.<br>Think fast.</div><p class="lead">Everyone gets the same twelve ridiculous categories and the same letter. Put down an answer that fits each category and begins with that letter. Only <strong>unique</strong>, valid answers earn points. Extra alliterative words can earn bonus points. Three new letters, same list — just like a classic categories night.</p></div><div class="form-row"><div><label>Category list</label><select class="field" id="category-deck" onchange="App.categoryDeck(this.value)">${CATEGORY_LISTS.map((v,i)=>`<option value="${i}" ${i===g.deck?'selected':''}>List ${i+1}: ${esc(v[0])}</option>`).join('')}</select></div><div><label>Time per player</label><select class="field" id="category-duration" onchange="App.categoryDuration(this.value)">${[60,90,120,180].map(t=>`<option value="${t}" ${t===g.seconds?'selected':''}>${t} seconds</option>`).join('')}</select></div></div>`)+panel(`<h3>Preview of this list</h3><div class="cat-list">${categories.map((c,i)=>`<div><span>${i+1}.</span> ${esc(c)}</div>`).join('')}</div><p class="tiny">Unofficial categories game, with original lists. Players take turns on this device; for a simultaneous round, use pen and paper while the first player’s timer runs.</p>${btn('Roll a letter →','App.categoryBegin()')}</div>`,'soft');
 if(g.phase==='pass')b=pass(g.players[g.cursor],`Round ${g.round+1} of 3. The letter is ${g.letter}. You'll have ${g.seconds} seconds to fill the same 12 categories. No peeking at earlier answers.`,'App.categoryPlay()');
 if(g.phase==='writing')b=panel(`<div class="statbar"><span class="stat">Round <strong>${g.round+1} / 3</strong></span><span class="stat">Player <strong>${esc(g.players[g.cursor])}</strong></span><span class="stat">Letter <strong class="letter-cube">${g.letter}</strong></span></div><div class="center"><div class="round-label">Your time is running</div>${timeHtml()}</div><div class="cat-list entry-list">${categories.map((c,i)=>`<label for="catanswer${i}"><span>${i+1}.</span> ${esc(c)}<input class="field" id="catanswer${i}" autocomplete="off" autocapitalize="sentences" spellcheck="false" maxlength="90" placeholder="Starts with ${g.letter}…"></label>`).join('')}</div><div class="actions">${btn('Submit answers early →','App.categorySubmit()')}</div><p class="tiny">When the clock runs out, whatever is in the boxes is saved automatically.</p>`);
 if(g.phase==='review'){const scores=categorySummary();b=panel(`<div class="round-label">Round ${g.round+1} — Read out your answers</div><h2>Same answer? No points.</h2><p class="lead">Duplicates are automatically crossed out. Tap an answer to <strong>challenge or disallow</strong> it if it doesn't fit the category. Tap again to restore it. Answers can be discussed before moving on.</p>${scoreboard(g.players,scores)}<div class="cat-review">${categories.map((c,i)=>`<section class="cat-review-card"><h3>${i+1}. ${esc(c)}</h3><div class="cat-replies">${g.players.map((p,j)=>{let a=g.answers[j][i],valid=categoryValid(j,i),duplicated=valid&&g.players.some((_,k)=>k!==j&&categoryValid(k,i)&&categoryClean(g.answers[k][i])===categoryClean(a)),earned=valid&&!duplicated;return `<button type="button" class="cat-reply ${earned?'good':'out'} ${g.invalid[j][i]?'disallowed':''}" onclick="App.categoryChallenge(${j},${i})"><span class="cat-player">${esc(p)}</span><span class="cat-answer">${esc(a||'—')}</span><span class="cat-points">${earned?'✓ +'+categoryAnswerPoints(a):g.invalid[j][i]?'✕ invalid':duplicated?'= duplicate':'0'}</span></button>`}).join('')}</div></section>`).join('')}</div><div class="divider"></div><h3>Running totals (including this round)</h3>${scoreboard(g.players,scores)}${btn(g.round===2?'Finish game →':'Next letter →','App.categoryNext()')}</div>`)}
 if(g.phase==='final'){const scores=g.points,max=Math.max(...scores);b=win(g.players.filter((_,i)=>scores[i]===max).join(' & ')+(scores.filter(x=>x===max).length>1?' tie!':' wins!'),'Three letters, thirty-six categories, and the strangest minds take the crown.',g.players,scores)}
 shell(b)}

}
function couchDoPenalty(text){g.penaltyReason=text;g.spiral[g.current]=true;g.stuck[g.current]=null;g.phase=g.pegs[g.current].length?'penalty':'turnend';g.lastResult=text;render()}
function couchResolveTherapy(){const matched=couchMatch();if(matched){g.stuck[g.current]=null;if(g.session==='ink'){g.beneficiary=g.current;g.awardReason='You both saw the same thing. Take any missing mastery peg!';g.phase='award'}else if(g.session==='individual'){g.beneficiary=g.therapist;g.awardReason=`${g.players[g.therapist]} read ${g.players[g.current]} perfectly! Choose a peg.`;g.phase='award'}else{g.beneficiary=-1;g.awardReason='Group therapy succeeded! The patient chooses who earns the mastery peg.';g.phase='beneficiary'}}else if(g.session==='ink'){couchDoPenalty('Different first impressions! The Spiral claims one mastery peg (if you have one).');return}else{g.stuck[g.current]={kind:g.session,owner:g.therapist};couchTurnEnd('The answer did not match. You are still in Therapy; on your next turn, another session will take place.') ;return}render()}
function couchRoll(){if(g.phase!=='roll')return;const current=g.current;
 if(g.stuck[current]){const s=g.stuck[current];couchSession(s.kind,s.kind==='individual'?s.owner:-1);return}
 if(g.spiral[current]){const die=1+rand(6);g.dice=[die,0];g.spiral[current]=false;g.pos[current]=(die-1)*6;couchSession('group');return}
 const d1=1+rand(6),d2=1+rand(6),old=g.pos[current],next=(old+d1+d2)%36;g.dice=[d1,d2];g.pos[current]=next;if(g.pegs[current].length===6&&old+d1+d2>=36){g.won=current;g.phase='final';render();return}couchStartSpace()}
function couchFinishTurn(){if(g.extra){g.extra=false;g.phase='roll'}else{g.current=(g.current+1)%g.players.length;g.turns++;g.phase='roll'}g.lastResult='';render();window.scrollTo?.({top:0,behavior:'instant'})}
function renderCouch(){let body='';const name=g.players[g.current],missing=couchMissing(g.current);
 if(g.phase==='intro')body=panel(`<div class="center"><div class="round-label">An original take on the vintage six-stage psychology board game</div><div class="display">Take a seat.<br>Get inside their head.</div><p class="lead">Roll two dice and travel through Infancy, Childhood, Adolescence, Adulthood, Seniority and Cosmos. Answer odd psychology questions, guess your friends’ secret answers in individual and group therapy, and collect six different mastery pegs. Reach the finish with all six to win.</p><p class="small">For 3–6 friends. One phone, private hand-offs. Your answers aren't stored or shared.</p>${btn('Start the session →','App.couchBegin()')}</div>${couchBoard()}`);
 if(g.phase!=='intro'&&g.phase!=='final'){
  const displayBoard=['roll','turnend','crisis','award','beneficiary','penalty','risk','insight'].includes(g.phase);
  body+=couchPegBar();
  if(g.phase==='roll')body+=panel(`<div class="center"><div class="round-label">Turn ${g.turns+1} · ${esc(name)}</div><div class="display">${g.spiral[g.current]?'🌀 Escape the Spiral':g.stuck[g.current]?'🛋️ Back on the couch':'🎲 Roll the dice'}</div><p class="lead">${g.spiral[g.current]?'Roll one die, move to a Therapy Office and attempt group therapy.':g.stuck[g.current]?'Your previous Therapy answer did not match. Try a new question before you can leave.':'Two dice, one dramatic destiny. Cross START / FINISH once you own all six mastery pegs.'}</p>${btn(g.stuck[g.current]?'Try therapy again →':g.spiral[g.current]?'Roll one die →':'Roll 2 dice →','App.couchRoll()')}</div>`);
  if(displayBoard)body+=couchBoard();
  if(g.phase==='risk')body+=panel(`<div class="round-label">${esc(COUCH_STAGES[g.stage].name)} · Insight / Chance</div><h2>Feeling lucky, ${esc(name)}?</h2><p class="lead">Attempt a multiple-choice question: get it right and earn this life-stage peg. Get it wrong and enter the Spiral, losing one peg. Or take the safe option and finish your turn.</p><div class="actions">${btn('Take the chance 🎲','App.couchRisk(true)')}${btn('Play it safe','App.couchRisk(false)','alt')}</div>`);
  if(g.phase==='insight'){const q=g.question;body+=panel(`<div class="round-label">${COUCH_STAGES[g.stage].emoji} Insight · ${esc(COUCH_STAGES[g.stage].name)} ${g.risk?'· HIGH RISK':''}</div><h2>${esc(q[0])}</h2><p class="muted">${esc(name)} — choose an answer. You ${couchHas(g.current,g.stage)?'already have this peg, so a correct answer wins another roll':'can collect a peg for this life stage'}.</p>${opts(q.slice(1,4),'App.couchInsight')}`)}
  if(g.phase==='insight-result'){const q=g.question;body+=panel(`<div class="round-label">Insight ${g.insightCorrect?'✓ Correct':'✕ Not quite'}</div><h2>${esc(q[1+q[4]])}</h2><p class="lead">${esc(q[5])}</p>${g.insightCorrect?`<p class="notice">${g.insightAdded?`${esc(COUCH_STAGES[g.stage].name)} mastery unlocked!`:'You already mastered this life stage. Extra roll earned!'}</p>`:g.risk?'<p class="error">The risky answer failed. Head to the Spiral.</p>':'<p class="muted">No peg this time — you can try another later.</p>'}${btn('Continue →','App.couchAfterInsight()')}</div>`);}
  if(g.phase==='patient')body+=panel(`<div class="center"><div class="round-label">Private answer · ${esc(name)} is the patient</div><h2>${g.session==='ink'?'The inkblot session':g.session==='individual'?'One-to-one Therapy':'Group Therapy'}</h2>${g.session==='ink'?couchBlotHtml():''}<p class="prompt">${esc(g.question.q)}</p><p class="muted">Only ${esc(name)} looks at the screen. Choose <strong>your own honest answer</strong>, then pass the phone face-down.</p>${g.question.type==='scale'?'<p class="tiny">1 = not at all; 10 = extremely.</p>':''}${couchChoiceButtons(g.question,'App.couchPatient')}</div>`);
  if(g.phase==='guess-pass'){const guesser=g.session==='individual'?g.players[g.therapist]:g.session==='ink'?'the other players': 'the group';body+=pass(guesser,`The patient has already locked in an answer. ${g.session==='individual'?`You are the therapist: predict ${name}'s reply.`:'Discuss together, then make one prediction about what '+name+' picked.'}`,'App.couchShowGuess()')}
  if(g.phase==='guess')body+=panel(`<div class="center"><div class="round-label">${g.session==='individual'?'Therapist prediction':'Group consensus prediction'}</div><h2>Can you read ${esc(name)}?</h2>${g.session==='ink'?couchBlotHtml():''}<p class="prompt">${esc(g.question.q)}</p><p class="muted">${g.session==='individual'?esc(g.players[g.therapist]):'Everyone except the patient'}: choose what you think ${esc(name)} answered.${g.question.type==='scale'?' Predictions within 1 point count as a match.':''}</p>${couchChoiceButtons(g.question,'App.couchGuess')}</div>`);
  if(g.phase==='therapy-reveal')body+=panel(`<div class="center"><div class="round-label">The big reveal</div><h2>${g.matched?'🎉 You know them too well!':'😅 Not on the same wavelength'}</h2><div class="form-row"><div class="answer-show"><span>${esc(name)} actually said</span><strong>${esc(couchAnswerText(g.question,g.truth))}</strong></div><div class="answer-show"><span>The prediction</span><strong>${esc(couchAnswerText(g.question,g.guess))}</strong></div></div><p class="lead">${g.matched?'Correct prediction!':g.session==='ink'?'Wrong impression — the Spiral beckons.':'Unmatched. The patient stays in Therapy until a later successful session.'}</p>${btn('Apply result →','App.couchApplyGuess()')}</div>`);
  if(g.phase==='beneficiary')body+=panel(`<div class="round-label">Group therapy succeeded</div><h2>${esc(name)} picks who gets the mastery peg</h2><p class="lead">You were accurately understood. Award the peg to one of the other group therapists.</p><div class="choice-grid">${g.players.map((p,i)=>i!==g.current?`<button class="choice" onclick="App.couchBeneficiary(${i})">${esc(p)}<small>${g.pegs[i].length} / 6 pegs</small></button>`:'').join('')}</div>`);
  if(g.phase==='award')body+=panel(`<div class="round-label">Mastery peg earned</div><h2>${esc(g.players[g.beneficiary])}, pick a life stage</h2><p class="lead">${esc(g.awardReason)}</p><div class="stage-choices">${couchMissing(g.beneficiary).map(i=>`<button class="choice" onclick="App.couchAward(${i})" style="border-color:${COUCH_STAGES[i].color}">${COUCH_STAGES[i].emoji} ${esc(COUCH_STAGES[i].name)}</button>`).join('')}</div>${couchMissing(g.beneficiary).length?'':btn('All mastered — continue →','App.couchAward(-1)')}`);
  if(g.phase==='crisis')body+=panel(`<div class="round-label">⚡ Life crisis!</div><div class="display">Plot twist.</div><p class="prompt">${esc(g.crisis[0])}</p>${btn('Apply crisis →','App.couchCrisis()')}</div>`);
  if(g.phase==='penalty')body+=panel(`<div class="round-label">The Spiral</div><h2>Lose one mastery peg</h2><p class="lead">${esc(g.penaltyReason)}</p><p class="muted">${esc(name)}, choose which life stage to surrender.</p><div class="stage-choices">${g.pegs[g.current].map(i=>`<button class="choice" onclick="App.couchLose(${i})">${COUCH_STAGES[i].emoji} ${esc(COUCH_STAGES[i].name)}</button>`).join('')}</div>`);
  if(g.phase==='turnend')body+=panel(`<div class="center"><div class="round-label">${esc(name)} · turn complete</div><h2>${g.extra?'🎁 Bonus roll!':'Over to the next player'}</h2><p class="lead">${esc(g.lastResult||'The dice had their say.')}</p><p class="muted">${esc(name)} has ${g.pegs[g.current].length} of the 6 mastery pegs.</p>${btn(g.extra?'Roll again →':'Next player →','App.couchNext()')}</div>`);
 }
 if(g.phase==='final'){const winner=g.won,other=g.pegs.map(p=>p.length);body=win(g.players[winner]+' masters all six!','Your couch is full, your life stages are complete, and you made it home.',g.players,other)}
 shell(body)}
App.couchBegin=()=>{if(g.phase==='intro'){g.phase='roll';render()}};
App.couchRoll=()=>couchRoll();
App.couchRisk=t=>{if(g.phase!=='risk')return;if(!t){couchTurnEnd('You chose the safe option. No peg, no drama.');return}g.risk=true;g.question=couchDrawInsight(g.stage);g.phase='insight';render()};
App.couchInsight=i=>{if(g.phase!=='insight'||![0,1,2].includes(i))return;g.insightCorrect=i===g.question[4];g.insightAdded=false;if(g.insightCorrect&&!couchHas(g.current,g.stage)){g.pegs[g.current].push(g.stage);g.insightAdded=true}g.phase='insight-result';render()};
App.couchAfterInsight=()=>{if(g.phase!=='insight-result')return;if(!g.insightCorrect&&g.risk){couchDoPenalty('A risky Insight did not land. Enter the Spiral and surrender one peg, if you have one.');return}couchTurnEnd(g.insightCorrect?(g.insightAdded?'New mastery unlocked!':'Already mastered — roll again!'):'No mastery this turn.',g.insightCorrect&&!g.insightAdded)};
App.couchPatient=i=>{if(g.phase!=='patient'||!couchChoices(g.question).some(([v])=>v===i))return;g.truth=i;g.phase='guess-pass';render()};
App.couchShowGuess=()=>{if(g.phase==='guess-pass'){g.phase='guess';render()}};
App.couchGuess=i=>{if(g.phase!=='guess'||!couchChoices(g.question).some(([v])=>v===i))return;g.guess=i;g.matched=couchMatch();g.phase='therapy-reveal';render()};
App.couchApplyGuess=()=>{if(g.phase==='therapy-reveal')couchResolveTherapy()};
App.couchBeneficiary=i=>{if(g.phase!=='beneficiary'||!g.players[i]||i===g.current)return;g.beneficiary=i;g.phase='award';render()};
App.couchAward=i=>{if(g.phase!=='award'||(i!==-1&&!couchMissing(g.beneficiary).includes(i)))return;if(i>=0)g.pegs[g.beneficiary].push(i);couchTurnEnd(`${g.players[g.beneficiary]} ${i>=0?'earned '+COUCH_STAGES[i].name+' mastery!':'already holds all six mastery pegs.'} The patient earns another roll.`,true)};
App.couchCrisis=()=>{if(g.phase!=='crisis')return;const kind=g.crisis[1],p=g.current,desc=g.crisis[0];if(kind==='gain'){g.beneficiary=p;g.awardReason=desc;g.phase='award';render();return}if(kind==='spiral'){couchDoPenalty(desc);return}if(kind==='extra'){couchTurnEnd(desc,true);return}const steps={forward:2,forward3:3,back:-3,back1:-1,back2:-2};g.pos[p]=(g.pos[p]+steps[kind]+36)%36;couchTurnEnd(desc)};
App.couchLose=i=>{if(g.phase!=='penalty'||!g.pegs[g.current].includes(i))return;g.pegs[g.current]=g.pegs[g.current].filter(x=>x!==i);couchTurnEnd(g.penaltyReason)};
App.couchNext=()=>{if(g.phase==='turnend')couchFinishTurn()};

window.App=App;
renderHome();
</script>
