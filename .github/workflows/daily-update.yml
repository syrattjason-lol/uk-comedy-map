name: Daily UK Comedy Map update

on:
  # Run at 00:01 in the UK, automatically handling GMT/BST.
  schedule:
    - cron: '1 0 * * *'
      timezone: 'Europe/London'

  # Allows a manual test from the GitHub Actions tab.
  workflow_dispatch:

  # Normal website edits deploy immediately, without running the scraper.
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Never cancel a running overnight scrape because another run starts.
concurrency:
  group: uk-comedy-map-pages
  cancel-in-progress: false

jobs:
  update-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Check expected file locations
        run: |
          test -f index.html
          test -f scraper/main_scraper_daily.py
          test -f scraper/requirements.txt
          test -f scraper/venues.xlsx

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install Python dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r scraper/requirements.txt

      - name: Install Playwright Chromium
        if: github.event_name != 'push'
        run: python -m playwright install --with-deps chromium

      - name: Scrape comedy venues and write only data/shows.json
        if: github.event_name != 'push'
        run: |
          # Leave time for validation, committing and deployment.
          timeout 330m python -u scraper/main_scraper_daily.py \
            --venues scraper/venues.xlsx \
            --out-json data/shows.json \
            --headless

      - name: Validate updated shows JSON
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/shows.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data, list) or len(data) < 100:
              raise SystemExit('Refusing to publish: fewer than 100 shows in JSON')
          if not all(isinstance(show, dict) and all(show.get(k) for k in ('city', 'comedian', 'venue', 'date')) for show in data):
              raise SystemExit('Refusing to publish: required fields are missing')
          print(f'Validated {len(data):,} comedy shows')
          PY

      - name: Commit refreshed shows to the main branch
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shows.json
          if git diff --staged --quiet; then
            echo 'No changes to shows.json'
          else
            git commit -m 'Update comedy listings (automated)'
            git push origin HEAD:main
          fi

      - name: Prepare site for GitHub Pages
        run: |
          mkdir -p "$RUNNER_TEMP/uk-comedy-site"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scraper/' \
            --exclude='*.py' \
            --exclude='*.xlsx' \
            ./ "$RUNNER_TEMP/uk-comedy-site/"
          test -f "$RUNNER_TEMP/uk-comedy-site/index.html"
          test -f "$RUNNER_TEMP/uk-comedy-site/data/shows.json"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site for deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/uk-comedy-site

  deploy:
    needs: update-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
